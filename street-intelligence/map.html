<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Intelligence Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pedestrian map of the Jijamata Rd footpath, Andheri East: where it is blocked, how much room there is to walk, and the best way through.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Cpath d='M9 24 L16 7 L23 24 L16 20 Z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap">
<style>
/* Layout: one phone-width app column, centred; full height on phones. */
:root {
  /* page around the app */
  --page: #E7EAE3; --page-ink: #1E2730;
  /* app: a light map product in both themes */
  --land: #EEF0EA; --block: #E1E4DC; --street: #FFFFFF; --hwy: #F6DFA8; --dash: #AEB4AA;
  --surface: #FFFFFF; --sunken: #F2F4F1; --line: #D9DDD5; --ink: #0F172A; --ink2: #475569; --ink3: #94A3B8;
  --accent: #2563EB; --accent-ink: #0B57D0; --accent-soft: #D3E3FD; --nav: #146C43; --nav-soft: #D1FAE5;
  --est: #FEF3C7; --est-ink: #92400E; --scrim: rgba(15, 23, 42, .32); --toast: #1F2937;
  --rare: #1AA6C0; --some: #F5B014; --most: #9F1D1D; --none: #AEB4AA;
  /* scale */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
  --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-xl: 24px; --r-f: 999px;
  --font: "Google Sans Flex", "Google Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #12171C; --page-ink: #E4E8EC; color-scheme: dark } }
:root[data-theme="dark"] { --page: #12171C; --page-ink: #E4E8EC; color-scheme: dark }
html, body { height: 100% }
[hidden] { display: none !important }
body { background: var(--page); color: var(--page-ink); font-family: var(--font); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; box-sizing: border-box; display: flex; justify-content: center }
.app { position: relative; width: 420px; max-width: 100%; height: 100%; max-height: 920px; min-height: 600px; border-radius: 28px; overflow: hidden; background: var(--land); color: var(--ink); box-shadow: 0 0 0 1px rgba(15,23,42,.08), 0 18px 50px rgba(15,23,42,.18); font-size: 14px; line-height: 20px; isolation: isolate }
@media (max-width: 480px) { body { padding-block: 0 } .app { border-radius: 0; max-height: none; box-shadow: none } }

/* type */
.t-title { font-size: 24px; line-height: 30px; font-weight: 700; margin: 0 }
.t-h1 { font-size: 20px; line-height: 26px; font-weight: 700; margin: 0 }
.t-h2 { font-size: 16px; line-height: 22px; font-weight: 700; margin: 0 }
.t-lead { font-size: 16px; line-height: 23px; font-weight: 500; margin: 0 }
.t-body { font-size: 14px; line-height: 20px; margin: 0 }
.t-label { font-size: 12px; line-height: 16px; font-weight: 500 }
.t-cap { font-size: 11px; line-height: 14px; font-weight: 600 }
.ink2 { color: var(--ink2) } .num { font-variant-numeric: tabular-nums }

/* primitives */
.app * { box-sizing: border-box }
:where(.app button) { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit }
.app :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: var(--r-s) }
.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; display: block }
.ic.spark { stroke: none; fill: url(#sparkGrad) }
.row { display: flex; align-items: center; gap: var(--s2) } .col { display: flex; flex-direction: column; gap: var(--s1); min-width: 0 } .grow { flex: 1 1 auto; min-width: 0 }
.between { justify-content: space-between }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--surface) }
.scr.map { background: var(--land) } .scr.sunk { background: var(--sunken) }
.scroll { overflow-y: auto; overscroll-behavior: contain; flex: 1 1 auto; min-height: 0 }
.stack { display: flex; flex-direction: column; gap: var(--s6); padding: var(--s3) var(--s4) 40px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 var(--s4) 0 14px; border-radius: var(--r-f); border: 1px solid var(--line); background: var(--surface); color: var(--accent-ink); font-weight: 600; white-space: nowrap }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff }
.btn.tonal { background: var(--accent-soft); border-color: transparent }
.btn.block { width: 100%; height: 48px; font-size: 15px }
.btn.sq { border-radius: var(--r-m); padding: 0 10px; height: 36px }
.btn[aria-disabled="true"] { color: var(--ink3); cursor: default }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 10px; border-radius: var(--r-f); background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.18); font-weight: 500; white-space: nowrap }
.fab { position: absolute; display: grid; place-items: center; background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.22); border-radius: var(--r-f); z-index: 4 }
.icon { width: 44px; height: 44px; border-radius: var(--r-f); display: grid; place-items: center; flex: 0 0 auto }
.icon.sunk { background: var(--sunken) }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: 0 -2px 12px rgba(0,0,0,.12); z-index: 4 }
.handle { width: 32px; height: 4px; border-radius: 2px; background: var(--line); margin: var(--s2) auto var(--s1) }
.topbar { display: flex; align-items: center; gap: var(--s1); padding: 36px var(--s2) var(--s2) var(--s1); background: var(--surface); border-bottom: 1px solid var(--line); flex: 0 0 auto }
.topbar .t { font-size: 18px; line-height: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.navbar { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 10px var(--s2) var(--s3); z-index: 5 }
.navbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--s1); font-size: 12px; font-weight: 500; color: var(--ink2) }
.navbar .ind { width: 56px; height: 32px; border-radius: var(--r-f); display: grid; place-items: center }
.navbar [aria-current="page"] { color: var(--ink); font-weight: 700 }
.navbar [aria-current="page"] .ind { background: var(--accent-soft); color: var(--accent-ink) }
.toast { position: absolute; left: var(--s4); right: var(--s4); bottom: 92px; background: var(--toast); color: #fff; padding: var(--s3) 14px; border-radius: var(--r-m); font-size: 13px; z-index: 50; box-shadow: 0 6px 18px rgba(0,0,0,.25) }
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20 }
.modal { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0; max-height: 86%; display: flex; flex-direction: column; box-shadow: 0 -4px 20px rgba(0,0,0,.18) }
.modal .scroll { padding: 0 var(--s5) 28px }
.sw { width: 14px; height: 8px; border-radius: 2px; flex: 0 0 auto; display: inline-block }
.legend { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); font-size: 12px; line-height: 16px; color: var(--ink2); align-items: center }
.legend span { display: inline-flex; align-items: center; gap: 5px }
.est { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: var(--r-f); background: var(--est); color: var(--est-ink) }
.dot { width: 10px; height: 10px; border-radius: 5px; display: inline-block; flex: 0 0 auto }

/* strip */
.strip { position: relative; display: grid; grid-template-columns: repeat(22, 1fr); gap: 2px; height: 22px; align-items: center; touch-action: none; cursor: ew-resize; user-select: none }
.strip i { height: 14px; border-radius: 3px; display: block }
.strip i.sel { height: 22px; box-shadow: 0 0 0 2px var(--ink) }
.strip i.you { box-shadow: 0 -6px 0 -3px var(--accent) }
.ends { display: flex; justify-content: space-between; font-size: 11px; line-height: 14px; font-weight: 600; color: var(--ink2); gap: var(--s2) }

/* explore */
.mapwrap { position: absolute; inset: 0; touch-action: none; overflow: hidden; cursor: grab }
.mapwrap.drag { cursor: grabbing }
.mapwrap svg { width: 100%; height: 100%; display: block }
.search { position: absolute; left: var(--s4); right: var(--s4); top: 40px; height: 52px; border-radius: var(--r-f); background: var(--surface); box-shadow: 0 2px 6px rgba(0,0,0,.18); display: flex; align-items: center; gap: var(--s3); padding: 0 10px 0 var(--s4); z-index: 4; color: var(--ink2); font-size: 16px }
.avatar { width: 32px; height: 32px; border-radius: var(--r-f); background: var(--accent-ink); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14px }
.chips { position: absolute; left: 0; right: 0; top: 100px; display: flex; gap: var(--s2); overflow-x: auto; padding: 2px var(--s4) var(--s2); z-index: 4; scrollbar-width: none }
.chips::-webkit-scrollbar { display: none }
.zoom { right: var(--s4); width: 40px; border-radius: var(--r-f); display: flex; flex-direction: column; overflow: hidden }
.zoom button { height: 40px; display: grid; place-items: center }
.zoom button + button { border-top: 1px solid var(--line) }
.readout { display: flex; align-items: center; gap: 10px; padding: 10px var(--s3); border-radius: var(--r-l); background: var(--sunken); width: 100% }

/* detail */
.verdict { border-radius: var(--r-l); padding: 14px var(--s4); display: grid; gap: 6px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-f); overflow: hidden }
.seg button { height: 32px; padding: 0 var(--s3); font-weight: 600; font-size: 13px }
.seg [aria-pressed="true"] { background: var(--ink); color: #fff }
.photos { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-right: calc(-1 * var(--s4)); padding-right: var(--s4); scroll-snap-type: x proximity }
.tile { flex: 0 0 104px; display: grid; gap: 6px; scroll-snap-align: start }
.ph { position: relative; width: 104px; aspect-ratio: 338 / 600; border-radius: var(--r-m); overflow: hidden; background-color: var(--sunken); background-repeat: no-repeat; border: 3px solid var(--none) }
.ph svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none }
.pbadge { position: absolute; left: 5px; top: 5px; display: inline-flex; align-items: center; gap: var(--s1); padding: 2px 6px; border-radius: var(--r-s); background: rgba(15,23,42,.72); color: #fff; font-size: 10px; font-weight: 600; line-height: 14px }
.pbadge i { width: 7px; height: 7px; border-radius: 4px; display: inline-block }
.tile .cap { font-size: 12px; line-height: 16px; color: var(--ink2) }
.tile .cap b { color: var(--ink); font-weight: 600 }
.bars { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sunken) }
.bars i { display: block; height: 100% }
.fact { display: flex; gap: 14px; align-items: flex-start; padding: var(--s3) 0; border-bottom: 1px solid var(--line) }
.fact:last-child { border-bottom: 0 }
.fact .ic { color: var(--ink2); margin-top: 2px }
.fact .v { font-size: 15px; line-height: 21px; font-weight: 500 }
.ribbon { width: 100%; height: 76px; display: block; touch-action: none; cursor: ew-resize }

/* lists, options, tiles */
.opt { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s1); width: 100%; border-bottom: 1px solid var(--line) }
.opt[aria-checked="true"] .o1 { font-weight: 700; color: var(--accent-ink) }
.opt[aria-disabled="true"] { color: var(--ink3) }
.opt .o1 { font-size: 15px; line-height: 21px; font-weight: 500 }
.daychips { display: flex; flex-wrap: wrap; gap: 6px }
.daychips button { height: 34px; padding: 0 var(--s3); border-radius: var(--r-f); border: 1px solid var(--line); font-size: 13px; font-weight: 500 }
.daychips [aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink) }
.tiles { display: flex; gap: var(--s3); flex-wrap: wrap }
.ltile { width: 76px; display: grid; gap: 6px; justify-items: center; font-size: 12px; line-height: 16px; font-weight: 500; text-align: center }
.ltile .th { width: 76px; height: 64px; border-radius: 14px; background: var(--land); display: grid; place-items: center; border: 2.5px solid transparent; color: #334155 }
.ltile[aria-pressed="true"] .th { border-color: var(--accent) }
.ltile[aria-pressed="true"] { color: var(--accent-ink); font-weight: 700 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px }
.card.sel { border: 2px solid var(--accent) }
.list { background: var(--surface); border-radius: var(--r-l); overflow: hidden }
.item { display: flex; gap: var(--s3); align-items: center; padding: var(--s3) 14px; border-top: 1px solid var(--line); width: 100% }
.item:first-child { border-top: 0 }
.item .bar { width: 6px; height: 34px; border-radius: 3px; flex: 0 0 auto }

/* ask */
.bubble { align-self: flex-end; max-width: 80%; background: var(--accent-soft); padding: var(--s3) var(--s4); border-radius: 20px 20px 6px 20px; font-size: 15px; line-height: 21px }
.answer { display: grid; gap: 10px }
.suggest { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px 0 var(--s3); border-radius: var(--r-f); border: 1px solid var(--line); color: var(--accent-ink); font-weight: 500; align-self: flex-start }
.field { display: flex; align-items: center; gap: 10px; height: 48px; border-radius: var(--r-f); background: var(--sunken); padding: 0 6px 0 18px }
.field input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 15px; color: var(--ink); outline: none }
.send { width: 36px; height: 36px; border-radius: var(--r-f); background: var(--accent); color: #fff; display: grid; place-items: center }

/* walk */
.banner { position: absolute; left: var(--s3); right: var(--s3); top: 36px; border-radius: 20px; background: var(--nav); color: #fff; display: flex; gap: 14px; align-items: center; padding: 14px var(--s4) 14px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.25); z-index: 3 }
.warn { position: absolute; left: var(--s3); right: var(--s3); border-radius: var(--r-l); background: var(--surface); box-shadow: 0 2px 10px rgba(0,0,0,.2); display: flex; gap: var(--s3); padding: var(--s3) 14px var(--s3) var(--s3); z-index: 3 }
.warn .wi { width: 40px; height: 40px; border-radius: var(--r-f); background: var(--most); color: #fff; display: grid; place-items: center; flex: 0 0 auto }
canvas.corridor { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
.trip { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: 0 -2px 12px rgba(0,0,0,.15); padding: 14px var(--s4) 22px; display: grid; gap: 10px; z-index: 3 }
.tag { position: absolute; z-index: 3; background: var(--surface); border-radius: 10px; padding: 6px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.2); font-weight: 700; white-space: nowrap }

/* lightbox */
.lb { position: absolute; inset: 0; z-index: 30; background: #0B1220; color: #fff; display: flex; flex-direction: column }
.lb .big { position: relative; flex: 1 1 auto; min-height: 0; margin: 0 var(--s4); border-radius: var(--r-l); overflow: hidden; background-repeat: no-repeat }
.lb .big svg { position: absolute; inset: 0; width: 100%; height: 100% }
.lb .meta { padding: var(--s3) var(--s4) var(--s6); display: grid; gap: var(--s2); font-size: 13px; color: #CBD5E1 }
.empty { padding: 40px var(--s6); text-align: center; color: var(--ink2) }
@media (prefers-reduced-motion: reduce) { .app * { transition: none !important; animation: none !important } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285F4"/><stop offset=".55" stop-color="#9B72CB"/><stop offset="1" stop-color="#D96570"/></linearGradient></defs></svg>
<main class="app" id="app" aria-label="Street Intelligence pedestrian map"><div class="empty" id="boot">Loading the footpath…</div></main>
<script src="data/manifest.js"></script>
<script>
(() => {
'use strict';
const app = document.getElementById('app');
const RAW = window.STREET_DATA;
if (!RAW || !RAW.days) { document.getElementById('boot').textContent = 'The footpath data did not load. Check that data/manifest.js sits next to this page.'; return; }

/* =================== Data =================== */
const L = RAW.corridor.length_m, NB = Math.ceil(L / 10), OBS = 1.4, NEAR = 1.4;
const binOf = m => Math.min(NB - 1, Math.max(0, Math.floor(m / 10)));
const binName = i => `${i * 10}–${Math.min(L, i * 10 + 10)} m`;
const WIDTH = { C: 1.5, P: 1.0, I: 0.6 }, RK = { C: 0, P: 1, I: 2 };
const BAND = { C: { name: 'clear', range: '≥ 1.2 m', cat: 'R' }, P: { name: 'social', range: '0.8–1.2 m', cat: 'S' }, I: { name: 'intimate', range: '< 0.8 m', cat: 'M' } };
const COL = { R: 'var(--rare)', S: 'var(--some)', M: 'var(--most)', N: 'var(--none)' };
const HEX = { R: '#1AA6C0', S: '#F5B014', M: '#9F1D1D', N: '#AEB4AA' };
const DIRS = { forward: { label: 'A → B', from: 'R.K. Chouhan', to: 'Amratlal G. Vasani', fromL: 'A', toL: 'B', toward: 'to B' }, return: { label: 'B → A', from: 'Amratlal G. Vasani', to: 'R.K. Chouhan', fromL: 'B', toL: 'A', toward: 'to A' } };
const LM = { 80: 'Green bins', 104: 'Highway service road', 162: 'Underpass walkway', 191: 'Underpass ends' };
const lmAt = i => { const k = Object.keys(LM).find(m => binOf(+m) === i); return k ? LM[k] : ''; };
const bandOf = n => n.near_field >= NEAR ? 'I' : n.obstruction >= OBS ? 'P' : 'C';
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
const mins = s => `${Math.floor(s / 60)} min ${Math.round(s % 60)} s`;
const plural = (n, w, pl) => `${n} ${n === 1 ? w : (pl || w + 's')}`;
const DAYS = RAW.days.filter(d => !d.mock).sort((a, b) => a.day - b.day);
const WALKS = [];
DAYS.forEach(d => ['forward', 'return'].forEach(key => { const w = d[key]; if (w) WALKS.push({ id: `${d.day}${key[0]}`, day: d.day, key, w, date: d.processed, light: w.lighting || 'daylight', dur: w.summary.duration_s }); }));
const dayNum = s => Date.parse(s + 'T00:00:00Z') / 864e5;
const LATEST = Math.max(...WALKS.map(x => dayNum(x.date)));
const fmtDate = s => new Date(s + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const RANGES = [
  { id: '24h', name: 'Last 24 hours', test: x => LATEST - dayNum(x.date) <= 1 },
  { id: '7d', name: 'Last 7 days', test: x => LATEST - dayNum(x.date) <= 7 },
  { id: '30d', name: 'Last 30 days', test: x => LATEST - dayNum(x.date) <= 30 },
  { id: '1y', name: 'Last year', test: x => LATEST - dayNum(x.date) <= 365 },
  { id: 'all', name: `All ${DAYS.length} survey days`, test: () => true },
  { id: 'custom', name: 'Custom', test: x => state.custom.has(x.day) }
];
function worst(W, i) { let b = null; for (const n of W.w.nodes) if (binOf(n.meter) === i && (!b || n.obstruction > b.obstruction)) b = n; return b; }
const newDir = () => ({ seen: 0, blocked: 0, b: { C: 0, P: 0, I: 0 }, wsum: 0 });
function typicalOf(b) { const t = ['I', 'P', 'C'].sort((x, y) => b[y] - b[x] || RK[y] - RK[x])[0]; return b[t] ? t : null; }
function computeStats(walks) {
  const out = [];
  for (let i = 0; i < NB; i++) {
    const s = { i, dir: { forward: newDir(), return: newDir() }, all: newDir(), ppl: [], veh: [], fix: [], swW: 0, swN: 0, horn: 0, light: {}, tiles: [] };
    for (const W of walks) {
      const n = worst(W, i); if (!n) continue;
      const bl = n.obstruction >= OBS, band = bandOf(n);
      for (const d of [s.dir[W.key], s.all]) { d.seen++; if (bl) d.blocked++; d.b[band]++; d.wsum += WIDTH[band]; }
      const lt = s.light[W.light] || (s.light[W.light] = { seen: 0, blocked: 0 }); lt.seen++; if (bl) lt.blocked++;
      if (W.light === 'daylight') for (const x of W.w.nodes) if (binOf(x.meter) === i && x.seg) { s.ppl.push(x.seg.people); s.veh.push(x.seg.vehicles); s.fix.push(x.seg.fixed); }
      const sw = (W.w.swerves || []).filter(e => binOf(e.m) === i).length; if (sw) { s.swW++; s.swN += sw; }
      s.horn += (W.w.honks || []).filter(e => binOf(e.m) === i).reduce((a, e) => a + e.dur, 0);
      s.tiles.push({ W, n, bl, band });

function SCR_you() {
  const saved = [...state.saved].sort((a, b) => a - b);
  app.insertAdjacentHTML('beforeend', `<section class="scr sunk" aria-label="You"><div class="scroll"><div class="col" style="gap:12px;padding:44px 16px 100px">
    <h1 class="t-title">You</h1>
    <h2 class="t-h2">Saved</h2>
    ${saved.length ? `<div class="list">${saved.map(i => { const s = STATS[i]; return spotItem(i, COL[catOf(s, 'blocked')], s.seen ? LAYERS.blocked.line(s) : 'No walks in this range'); }).join('')}</div>` : '<p class="t-body ink2">Save a stretch from its page to find it here.</p>'}
    <h2 class="t-h2" style="margin-top:8px">Walks</h2>
    <div class="list">${WALKS.map(W => { const bl = new Set(W.w.nodes.filter(n => n.obstruction >= OBS).map(n => binOf(n.meter))).size; return `<div class="item"><span class="dot" style="background:${W.light === 'night' ? '#334155' : 'var(--some)'}"></span><div class="col grow" style="gap:1px"><b class="num">Day ${W.day} · ${DIRS[W.key].label}</b><span class="t-label ink2 num">${fmtDate(W.date)} · ${W.light} · ${mins(W.dur)} · ${bl} of ${NB} blocked</span></div></div>`; }).join('')}</div>
  </div></div>${navbar('You')}</section>`);
}
function SCR_record() {
  app.insertAdjacentHTML('beforeend', `<section class="scr map" aria-label="Record a footpath"><div class="mapwrap" id="map"></div>
    <button class="fab" type="button" data-act="back" style="left:16px;top:40px;width:44px;height:44px" aria-label="Back">${ic('back', 22)}</button>
    <div class="sheet" style="padding:6px 20px 28px;display:grid;gap:12px"><div class="handle"></div>
      <div class="col" style="gap:2px"><h1 class="t-h1">Record the opposite footpath</h1><span class="t-body ink2">One walk from A to B, about 2½ minutes</span></div>
      ${[['swap', 'Phone sideways, clipped at chest height'], ['check', 'Main 1× lens'], ['check', 'Horizon in the top third'], ['check', 'Start at A, stop at B']].map(([k, x]) => `<div class="row" style="gap:10px"><span style="color:var(--rare)">${ic(k, 18)}</span>${x}</div>`).join('')}
      <p class="t-label ink2" style="margin:0">Recording runs in the Street Intelligence capture app. It saves the time and start point and blurs faces before upload.</p>
      <button class="btn primary block" type="button" data-act="back">Done</button></div></section>`);
  mapView = buildMap(document.getElementById('map')); mapView.setSafe(app.querySelector('.sheet').offsetTop, true);
}
const SCREENS = { explore: SCR_explore, search: SCR_search, ask: SCR_ask, detail: SCR_detail, directions: SCR_directions, walk: SCR_walk, contribute: SCR_contribute, you: SCR_you, record: SCR_record };

/* =================== Actions =================== */
function refresh() { recompute(); if (state.screen === 'explore') updateExplore(); else if (state.screen === 'detail') updateDetail(); else render(); }
async function share() {
  const s = STATS[state.spot], text = `${binName(s.i)} on the Jijamata Rd footpath: ${s.seen ? LAYERS.blocked.line(s).toLowerCase() : 'no walks yet'}.`, url = location.href.split('#')[0] + '#detail';
  try { if (navigator.share) { await navigator.share({ title: 'Street Intelligence', text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(`${text} ${url}`); toast('Link copied'); } catch (e) { toast(text); }
}
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.getAttribute('aria-disabled') === 'true') return;
  switch (el.dataset.act) {
    case 'nav': go(el.dataset.to); break;
    case 'back': back(); break;
    case 'close': closeModal(); break;
    case 'askq': state.chat.push({ q: QUESTIONS.find(q => q.id === el.dataset.id).q, id: el.dataset.id }); drawChat(); break;
    case 'clearchat': state.chat = []; render(); break;
    case 'layers': openLayers(); break;
    case 'layer': state.layer = el.dataset.id; store.set('layer', state.layer); closeModal(); updateExplore(); break;
    case 'zin': mapView.zoom(1.6); break;
    case 'zout': mapView.zoom(1 / 1.6); break;
    case 'fit': mapView.fit(); break;
    case 'gospot': state.spot = +el.dataset.i; closeModal(); if (state.screen === 'detail') updateDetail(); else go('detail'); break;
    case 'spots': openSpots(); break;
    case 'about': openAbout(); break;
    case 'dirmode': state.mode = el.dataset.mode; go('directions'); break;
    case 'mode': state.mode = el.dataset.mode; render(); break;
    case 'swap': state.travel = state.travel === 'forward' ? 'return' : 'forward'; render(); break;
    case 'steps': openSteps(); break;
    case 'startwalk': state.walkD = 0; go('walk'); break;
    case 'endwalk': state.stack = []; go('explore', { replace: true }); break;
    case 'playpause': if (state.walkD >= L) state.walkD = 0; state.playing = !state.playing; lastT = performance.now(); setPlay(); break;
    case 'speed': state.speed = +el.dataset.x; app.querySelectorAll('[data-act="speed"]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.x === state.speed)); break;
    case 'date': openDate(); break;
    case 'range': state.range = el.dataset.id; closeModal(); refresh(); break;
    case 'cday': { if (state.range !== 'custom') { state.range = 'custom'; state.custom = new Set(DAYS.map(d => d.day)); } const d = +el.dataset.d; if (state.custom.has(d)) { if (state.custom.size > 1) state.custom.delete(d); } else state.custom.add(d); el.setAttribute('aria-pressed', state.custom.has(d)); recompute(); if (state.screen === 'explore') updateExplore(); else if (state.screen === 'detail') updateDetail(); app.querySelectorAll('.opt[role="radio"]').forEach(o => { o.setAttribute('aria-checked', 'false'); const ck = o.querySelector('span[style*="accent-ink"]'); if (ck) ck.remove(); }); break; }
    case 'light': openLight(); break;
    case 'setlight': state.light = el.dataset.id; closeModal(); refresh(); break;
    case 'pdir': state.photoDir = el.dataset.k; updateDetail(); break;
    case 'photo': openPhoto(el.dataset.w); break;
    case 'save': { const i = state.spot; if (state.saved.has(i)) { state.saved.delete(i); toast('Removed from saved'); } else { state.saved.add(i); toast('Saved'); } store.set('saved', [...state.saved]); updateDetail(); break; }
    case 'share': share(); break;
    case 'check': { store.set('checks', store.get('checks', 0) + 1); toast(`Thanks. The photo model said ${checkTile.t.bl ? 'blocked' : 'clear'}.`); pickCheck(); render(); break; }
  }
});
app.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
const startHash = (location.hash || '').slice(1); if (SCREENS[startHash] && !['walk', 'record', 'search'].includes(startHash)) state.screen = startHash;
render();
})();
</script>
</body>
</html>
