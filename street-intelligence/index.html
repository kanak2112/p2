<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: findings (route + three numbers) on top; then a main column (spot x day grid, ranked spots,
   photo tracks, method) beside a sticky spot inspector. One data encoding everywhere: days blocked. */
:root {
  color-scheme: light;
  --bg: #f3f4f2;
  --panel: #fbfbfa;
  --sunken: #e8eae7;
  --line: #d6d9d5;
  --grid: #e6e8e5;
  --fg: #141816;
  --fg-2: #4a524e;
  --muted: #727a76;
  /* Days-blocked ramp: one hue, 0 (never) -> 4 (every surveyed day). Per-day states reuse it:
     clear = r0, busy = r1, obstructed = r4. */
  --r0: #e3e6e2; --r1: #f1cbbd; --r2: #e3957c; --r3: #c65a3d; --r4: #8c2915;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 40px;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #121513; --panel: #181c1a; --sunken: #202523; --line: #323935; --grid: #262c29;
  --fg: #eef1ef; --fg-2: #bcc4c0; --muted: #8b9590;
  --r0: #2a302d; --r1: #55302a; --r2: #874031; --r3: #c05a3f; --r4: #f08262;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121513; --panel: #181c1a; --sunken: #202523; --line: #323935; --grid: #262c29;
  --fg: #eef1ef; --fg-2: #bcc4c0; --muted: #8b9590;
  --r0: #2a302d; --r1: #55302a; --r2: #874031; --r3: #c05a3f; --r4: #f08262;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 64px; display: flex; flex-direction: column; gap: var(--s6); }
@media (max-width: 560px) { .wrap { padding-inline: 16px; gap: 32px; } }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; font-weight: 600; }
h1 { font-size: clamp(30px, 4vw, 44px); font-weight: 700; line-height: 1; letter-spacing: -.01em; }
h2 { font-size: 21px; line-height: 1.2; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); max-width: 72ch; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible, .col:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
section { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--s2) var(--s4); padding-bottom: var(--s2); border-bottom: 1px solid var(--line); }

/* Header */
header { display: flex; flex-direction: column; gap: var(--s2); }
header .meta { color: var(--fg-2); font-size: 15px; }

/* Findings */
.findings { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--s5); align-items: center; }
@media (max-width: 900px) { .findings { grid-template-columns: minmax(0, 1fr); } }
.route svg { display: block; width: 100%; height: auto; }
.route text { font-family: var(--font-mono); font-size: 11px; fill: var(--fg-2); }
.route .hit { cursor: pointer; }
.nums { display: flex; flex-direction: column; gap: var(--s5); }
.num { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--s4); align-items: baseline; padding-bottom: var(--s4); border-bottom: 1px solid var(--line); }
.num:last-child { border-bottom: 0; }
.num .v { white-space: nowrap; font: 700 46px/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.num .k { font-size: 16px; line-height: 1.35; }
@media (max-width: 560px) { .num { grid-template-columns: minmax(0, 1fr); gap: var(--s1); } .num .v { font-size: 40px; } }
.num .k small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.ramp-key { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); font-size: 12.5px; color: var(--fg-2); }
.ramp-key .sw { display: inline-flex; gap: 2px; }
.ramp-key .sw i { width: 18px; height: 10px; border-radius: 2px; display: inline-block; }

/* Main grid */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--s6); align-items: start; }
.main { display: flex; flex-direction: column; gap: var(--s6); min-width: 0; }
@media (max-width: 1100px) {
  /* Single column: put the inspector right after the grid it explains. */
  .layout { display: flex; flex-direction: column; align-items: stretch; }
  .main { display: contents; }
  .o-grid { order: 1; } .layout .inspector { order: 2; position: static; } .o-spots { order: 3; } .o-tracks { order: 4; } .o-method { order: 5; }
}

/* Spot x day grid */
.matrix-wrap { overflow-x: auto; }
.matrix svg { display: block; width: 100%; min-width: 640px; height: auto; }
.matrix text { font-family: var(--font-mono); font-size: 11px; fill: var(--fg-2); }
.matrix .rowlab { font-family: var(--font-body); font-size: 13px; fill: var(--fg); }
.matrix .grp { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .08em; fill: var(--muted); }
.matrix .col { cursor: pointer; }
.matrix .colsel { fill: none; stroke: var(--fg); stroke-width: 2; pointer-events: none; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--fg); color: var(--bg); font: 12px/1.45 var(--font-mono); padding: 6px 9px; border-radius: 4px; max-width: 280px; }

/* Ranked spots */
.tbl-wrap { overflow-x: auto; }
table.spots { width: 100%; border-collapse: collapse; min-width: 600px; font-size: 14px; }
.spots th { text-align: left; font: 600 11px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 var(--s2) var(--s2); border-bottom: 1px solid var(--line); }
.spots td { padding: var(--s2); border-bottom: 1px solid var(--grid); vertical-align: middle; font-variant-numeric: tabular-nums; }
.spots tbody tr { cursor: pointer; }
.spots tbody tr:hover td, .spots tbody tr.on td { background: var(--sunken); }
.spots .rk { font: 600 15px var(--font-display); color: var(--muted); width: 2ch; }
.spots .where small { display: block; color: var(--muted); font-size: 12.5px; }
.strip { display: inline-flex; gap: 2px; vertical-align: middle; margin-right: 6px; }
.strip i { width: 12px; height: 16px; border-radius: 2px; display: inline-block; }
.strip i.na { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.resp { color: var(--fg-2); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13.5px; }
.ghost { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; font-size: 13.5px; }
.ghost:hover { border-color: var(--muted); }

/* Photos */
.ph { position: relative; aspect-ratio: 9 / 16; background: var(--sunken); border-radius: 3px; overflow: hidden; max-width: 100%; background-repeat: no-repeat; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .aim { position: absolute; left: 50%; bottom: 22%; width: 18px; height: 18px; margin-left: -9px; border: 2px solid rgba(255,255,255,.9); border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.45); pointer-events: none; }
.ph.thumb { width: 40px; }
.ph.thumb .aim { display: none; }
.ph.empty::after { content: "No footage"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; color: var(--muted); }

/* Tracks */
.ctl { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 13.5px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.tracks { overflow-x: auto; overflow-y: hidden; border-radius: var(--radius); background: var(--sunken); }
.canvas { position: relative; }
.trk { position: relative; height: 150px; border-top: 1px solid var(--line); }
.trk .lab { position: sticky; left: 0; z-index: 3; display: inline-block; font-size: 12.5px; padding: 3px 8px; background: var(--panel); border-bottom-right-radius: 4px; }
.node { position: absolute; top: 24px; height: 118px; padding: 0; border: 2px solid transparent; border-radius: 3px; overflow: hidden; background: #000; cursor: pointer; transform: translateX(-50%); }
.node img { display: block; height: 100%; width: auto; }
.node.hot { border-color: var(--fg); z-index: 2; }
.axis { position: relative; height: 26px; background: var(--panel); }
.axis .t { position: absolute; bottom: 0; width: 1px; height: 6px; background: var(--muted); }
.axis .l { position: absolute; top: 4px; transform: translateX(-50%); font: 11px var(--font-mono); color: var(--fg-2); white-space: nowrap; }
.cursor { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg); opacity: .6; pointer-events: none; display: none; z-index: 4; }

/* Inspector */
.inspector { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: var(--s4); padding: var(--s4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.insp-top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); }
.insp-top .m { font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.side { display: flex; flex-direction: column; gap: var(--s2); }
.side-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); font-size: 13.5px; }
.side-head b { font-weight: 600; }
.days { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.days figure { margin: 0; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.days figcaption { display: flex; align-items: center; gap: 4px; font: 11px var(--font-mono); color: var(--fg-2); }
.days figcaption i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.verdict { font-size: 14px; padding: var(--s3); border-radius: 4px; background: var(--sunken); }
details.calib summary { cursor: pointer; font-size: 13px; color: var(--fg-2); }
details.calib .row { display: flex; justify-content: space-between; font-size: 13px; margin-top: var(--s2); }
details.calib input { width: 100%; accent-color: var(--fg); }
.btn { border: 1px solid var(--fg); background: var(--fg); color: var(--bg); border-radius: var(--radius); padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }

/* Method */
.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--s4) var(--s5); font-size: 14px; color: var(--fg-2); }
.method b { display: block; color: var(--fg); font-weight: 600; margin-bottom: 2px; }

/* Card dialog */
dialog { border: 0; padding: 0; border-radius: 8px; background: var(--panel); color: var(--fg); width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
.dlg { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s5); }
#cardCanvas { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
.actions { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.empty-state { padding: var(--s5); }
.empty-state code { font-family: var(--font-mono); background: var(--sunken); padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>Street Intelligence</h1>
    <p class="meta" id="meta"></p>
  </header>

  <section>
    <div class="findings">
      <div>
        <div class="route" id="route"></div>
        <div class="ramp-key" id="rampKey"></div>
      </div>
      <div class="nums" id="nums"></div>
    </div>
  </section>

  <div class="layout">
    <div class="main">
      <section class="o-grid">
        <div class="sec-head"><h2>Every spot, every day</h2><span class="note">10 m spots · click a column to inspect</span></div>
        <div class="matrix-wrap matrix" id="matrix"></div>
      </section>

      <section class="o-spots">
        <div class="sec-head"><h2>Spots ranked</h2><button class="linkbtn" id="moreSpots"></button></div>
        <div class="tbl-wrap" id="spotList"></div>
      </section>

      <section class="o-tracks">
        <div class="sec-head">
          <h2>Photo tracks</h2>
          <div class="ctl">
            <div class="seg" role="group" aria-label="Compare">
              <button data-cmp="days" aria-pressed="true">One side, all days</button>
              <button data-cmp="dirs" aria-pressed="false">Both sides, one day</button>
            </div>
            <div class="seg" role="group" aria-label="Side" id="sideSeg">
              <button data-side="forward" aria-pressed="true">A side</button>
              <button data-side="return" aria-pressed="false">B side</button>
            </div>
            <div class="seg" role="group" aria-label="Day" id="daySeg" hidden></div>
          </div>
        </div>
        <p class="note" id="trackNote"></p>
        <div class="tracks" id="tracks"><div class="canvas" id="canvas"></div></div>
      </section>

      <section class="o-method">
        <div class="sec-head"><h2>Method and limits</h2></div>
        <div class="method" id="method"></div>
      </section>
    </div>

    <aside class="inspector" aria-live="polite">
      <div id="inspector" style="display:flex;flex-direction:column;gap:16px"></div>
      <details class="calib">
        <summary>Calibrate photo alignment</summary>
        <div class="row"><label for="look">Look-ahead</label><span class="mono" id="lookVal"></span></div>
        <input type="range" id="look" min="2" max="8" step="0.5">
        <p class="note" style="font-size:12px">Each photo shows the spot from a few metres away. Drag until the circle sits on the same object across a row.</p>
      </details>
    </aside>
  </div>
</div>

<div class="tip" id="tip" hidden></div>

<dialog id="cardDlg">
  <div class="dlg">
    <div class="sec-head" style="border:0;padding:0"><h2 id="cardTitle">Evidence card</h2><button class="ghost" id="closeCard">Close</button></div>
    <canvas id="cardCanvas" width="1200" height="900" aria-label="Evidence card image"></canvas>
    <div class="actions">
      <button class="btn" id="saveCard">Save image</button>
      <button class="ghost" id="copyCard">Copy text</button>
      <span class="note" id="cardMsg"></span>
    </div>
  </div>
</dialog>

<script src="data/manifest.js"></script>
<script>
(() => {
  const D = window.STREET_DATA;
  const $ = id => document.getElementById(id);
  const OBS = 1.4;     // clutter index counted as obstructed
  const BUSY = 1.1;    // clutter index counted as busy
  const BIN = 10;      // spot length, metres
  const MATCH = 6;     // max metres between a spot and a frame
  const BENCH_M = 100; // Neural City, State of Indian Streets 2026: 100 m walkable without obstacles

  if (!D || !D.days || !D.days.some(d => !d.mock)) {
    $('app').innerHTML = `<div class="empty-state"><h2>No processed walks yet</h2><p class="note" style="margin-top:8px">Put <code>point_a_to_b.mp4</code> and <code>point_b_to_a.mp4</code> next to <code>process_day1.py</code>, run <code>python process_day1.py</code>, then reload.</p></div>`;
    return;
  }

  const L = D.corridor.length_m;
  const NB = Math.ceil(L / BIN);
  const days = D.days.filter(d => !d.mock).sort((a, b) => a.day - b.day);   // placeholders are never shown or counted
  const SIDES = [
    { key: 'forward', name: 'A side', walk: 'A→B walks' },
    { key: 'return', name: 'B side', walk: 'B→A walks' }
  ];
  const state = { meter: 75, cmp: 'days', side: 'forward', dayIdx: 0, rows: [] };
  const fmt = (n, d = 0) => Number(n).toFixed(d);
  const range = i => `${i * BIN}–${Math.min(L, (i + 1) * BIN)} m`;
  const light = w => (w && w.lighting) || '';
  const binOf = m => Math.min(NB - 1, Math.max(0, Math.floor(m / BIN)));
  const LANDMARK_NAMES = { turn_onto_highway_service_rd: 'turn to service road', underpass_walkway_east_end: 'underpass', underpass_walkway_west_end: 'underpass end', green_bins_approx: 'green bins' };
  const landmarks = Object.entries(D.corridor.landmarks || {}).map(([k, m]) => ({ name: LANDMARK_NAMES[k] || k.replace(/_/g, ' '), m })).sort((a, b) => a.m - b.m);
  const RAMP = ['var(--r0)', 'var(--r1)', 'var(--r2)', 'var(--r3)', 'var(--r4)'];
  const shareColor = (c, n) => n ? RAMP[Math.round(4 * c / n)] : 'none';
  const stateColor = v => v == null ? 'none' : v >= OBS ? 'var(--r4)' : v >= BUSY ? 'var(--r1)' : 'var(--r0)';
  const stateWord = v => v == null ? 'no footage' : v >= OBS ? 'obstructed' : v >= BUSY ? 'busy' : 'clear';

  /* ---------- Positions: frames are shifted to the spot they look at ---------- */
  // The manifest stores CAMERA positions. A forward-facing camera shows the ground a few metres ahead.
  let LOOK = 5;
  try { const v = +localStorage.getItem('si-look'); if (v >= 2 && v <= 8) LOOK = v; } catch (e) {}
  let vcache = new WeakMap();
  const r1 = x => Math.round(x * 10) / 10;
  const spotOf = (cam, key) => r1(Math.max(0, Math.min(L, key === 'forward' ? cam + LOOK : cam - LOOK)));
  function walk(d, key) {
    const w = d && d[key]; if (!w) return null;
    if (!vcache.has(w)) vcache.set(w, { ...w, key, nodes: w.nodes.map(n => ({ ...n, cam: n.meter, meter: spotOf(n.meter, key) })) });
    return vcache.get(w);
  }
  function nearest(w, m) {
    if (!w) return null;
    let best = null, bd = Infinity;
    for (const n of w.nodes) { const d = Math.abs(n.meter - m); if (d < bd) { bd = d; best = n; } }
    return bd <= MATCH ? best : null;
  }
  function binWorst(w, i) {   // worst frame of a walk within spot i: the rule every count uses
    if (!w) return null;
    let best = null;
    for (const n of w.nodes) if (binOf(n.meter) === i && (!best || n.obstruction > best.obstruction)) best = n;
    return best;
  }
  let pcache = {};
  function persistence(key) {
    if (pcache[key]) return pcache[key];
    return pcache[key] = [...Array(NB).keys()].map(i => {
      let c = 0, n = 0;
      days.forEach(d => { const b = binWorst(walk(d, key), i); if (b) { n++; if (b.obstruction >= OBS) c++; } });
      const cls = !n ? 'none' : c === 0 ? 'clear' : n < 3 ? 'unconfirmed' : c === n ? 'every' : 'some';
      return { c, n, cls };
    });
  }
  function obstacleFree(w) {
    const ns = w.nodes.slice().sort((a, b) => a.meter - b.meter);
    let from = 0, best = { m: 0, from: 0, to: 0 };
    const close = to => { if (to - from > best.m) best = { m: to - from, from, to }; };
    for (const n of ns) if (n.obstruction >= OBS) { close(n.meter); from = n.meter; }
    close(L);
    return best;
  }
  const respFor = (a, b) => [a, b].some(p => p.cls === 'every') ? 'Build: repair or relocate'
    : [a, b].some(p => p.cls === 'some') ? 'Manage: parking, vending, timing'
    : [a, b].some(p => p.cls === 'unconfirmed') ? 'Keep surveying' : '';
  const nearLandmark = i => (landmarks.find(l => Math.abs(l.m - (i * BIN + BIN / 2)) <= 8) || {}).name || '';

  /* ---------- Photos from the per-second spot views ---------- */
  function viewFor(w, S) {
    const sv = w && w.spot_views; if (!sv || !sv.m.length) return null;
    const lo = Math.min(...sv.m), hi = Math.max(...sv.m);
    const target = Math.max(lo, Math.min(hi, w.key === 'forward' ? S - LOOK : S + LOOK));
    let bi = 0, bd = Infinity;
    sv.m.forEach((m, i) => { const dd = Math.abs(m - target); if (dd < bd) { bd = dd; bi = i; } });
    return bd <= 4 ? { idx: bi, cam: sv.m[bi], t: sv.t[bi] } : null;
  }
  function spriteStyle(w, idx) {
    const sv = w.spot_views, sh = Math.floor(idx / sv.per_sheet), k = idx % sv.per_sheet;
    const col = k % sv.cols, row = Math.floor(k / sv.cols), rows = sv.rows[sh];
    return `background-image:url('${w.folder}/${sv.sheets[sh]}');background-size:${sv.cols * 100}% ${rows * 100}%;` +
      `background-position:${sv.cols > 1 ? col / (sv.cols - 1) * 100 : 0}% ${rows > 1 ? row / (rows - 1) * 100 : 0}%`;
  }
  function photo(w, S, cls = '') {
    const v = w && viewFor(w, S);
    if (v) return `<div class="ph ${cls}" style="${spriteStyle(w, v.idx)}" role="img" aria-label="Spot at ${fmt(S)} m"><span class="aim"></span></div>`;
    const n = w && nearest(w, S);
    if (n) return `<div class="ph ${cls}"><img src="${w.folder}/${n.file}" alt=""></div>`;
    return `<div class="ph empty ${cls}"></div>`;
  }

  /* ---------- Header + three numbers ---------- */
  const lightCount = key => { const c = {}; days.forEach(d => { if (d[key]) c[light(d[key])] = (c[light(d[key])] || 0) + 1; }); return Object.entries(c).map(([k, v]) => `${v} ${k}`).join(', '); };
  const nWalks = days.reduce((a, d) => a + SIDES.filter(s => d[s.key]).length, 0);
  $('meta').textContent = `Jijamata Rd / Old Nagardas Rd, Andheri East · ward ${D.corridor.ward || ''} · ${fmt(L)} m · ${days.length} days · ${nWalks} walks (A→B ${lightCount('forward')}; B→A ${lightCount('return')})`;

  function renderNums() {
    const walks = [];
    days.forEach(d => SIDES.forEach(s => { const w = walk(d, s.key); if (w) walks.push({ d, s, w, f: obstacleFree(w) }); }));
    const ok = walks.filter(x => x.f.m >= BENCH_M).length;
    const best = walks.reduce((a, x) => x.f.m > a.f.m ? x : a, walks[0]);
    const shares = walks.map(x => 100 * x.w.nodes.filter(n => n.obstruction >= OBS).length / x.w.nodes.length);
    const A = persistence('forward'), B = persistence('return');
    const every = [...Array(NB).keys()].filter(i => A[i].cls === 'every' || B[i].cls === 'every');
    const both = every.filter(i => A[i].cls === 'every' && B[i].cls === 'every');
    $('nums').innerHTML = `
      <div class="num"><span class="v">${ok}/${walks.length}</span><span class="k">walks had ${BENCH_M} m without an obstacle<small>Longest: ${fmt(best.f.m)} m. Benchmark: Neural City, 2026.</small></span></div>
      <div class="num"><span class="v">${fmt(Math.min(...shares))}–${fmt(Math.max(...shares))}%</span><span class="k">of each walk obstructed<small>Varies by day and direction.</small></span></div>
      <div class="num"><span class="v">${every.length}</span><span class="k">spots blocked on every surveyed day<small>${both.length ? `${both.map(range).join(', ')} from both sides.` : 'None from both sides.'}</small></span></div>`;
  }

  /* ---------- Route (schematic traced from Google Maps) ---------- */
  const ROUTE = [[1333, 143], [1083, 298], [1070, 340], [1102, 406], [912, 494]];
  const seglen = ROUTE.slice(1).map((p, i) => Math.hypot(p[0] - ROUTE[i][0], p[1] - ROUTE[i][1]));
  const routeLen = seglen.reduce((a, b) => a + b, 0);
  function routeAt(m) {
    let d = Math.max(0, Math.min(L, m)) / L * routeLen;
    for (let i = 0; i < seglen.length; i++) {
      if (d <= seglen[i] || i === seglen.length - 1) {
        const [x0, y0] = ROUTE[i], [x1, y1] = ROUTE[i + 1], t = Math.min(1, d / seglen[i]);
        return { x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, dx: (x1 - x0) / seglen[i], dy: (y1 - y0) / seglen[i] };
      }
      d -= seglen[i];
    }
  }
  function renderRoute() {
    const per = { forward: persistence('forward'), return: persistence('return') };
    let s = `<svg viewBox="830 100 560 455" role="img" aria-label="Route coloured by days blocked per 10 m spot">`;
    s += `<path d="M845 110 L1005 540 L1080 540 L925 110 Z" fill="var(--sunken)"/><path d="M940 110 L1100 540 L1160 540 L1000 110 Z" fill="var(--sunken)"/>`;
    s += `<text x="1166" y="540" style="fill:var(--muted)">Western Express Hwy</text>`;
    SIDES.forEach((side, k) => {
      const off = k ? 6 : -6;
      for (let i = 0; i < NB; i++) {
        const pts = [];
        for (let m = i * BIN; m <= Math.min(L, (i + 1) * BIN) + 0.01; m += 2) { const q = routeAt(Math.min(m, L)); pts.push(`${(q.x - q.dy * off).toFixed(1)},${(q.y + q.dx * off).toFixed(1)}`); }
        const p = per[side.key][i];
        s += `<polyline points="${pts.join(' ')}" fill="none" stroke="${p.n ? shareColor(p.c, p.n) : 'var(--line)'}" stroke-width="9" stroke-linecap="butt"/>`;
      }
    });
    for (let i = 0; i < NB; i++) {
      const a = routeAt(i * BIN), b = routeAt(Math.min(L, (i + 1) * BIN));
      s += `<line class="hit" data-bin="${i}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="34"/>`;
    }
    const a = routeAt(0), b = routeAt(L);
    s += `<text x="${a.x + 14}" y="${a.y + 4}" style="fill:var(--fg);font-weight:500">A</text><text x="${a.x - 6}" y="${a.y - 16}" text-anchor="end">R.K. Chouhan Communications</text>`;
    s += `<text x="${b.x - 20}" y="${b.y + 4}" style="fill:var(--fg);font-weight:500">B</text><text x="${b.x}" y="${b.y + 28}" text-anchor="middle">Amratlal G. Vasani</text>`;
    s += `<text x="1214" y="246" transform="rotate(-32 1214 246)" text-anchor="middle" style="fill:var(--muted)">Jijamata Rd / Old Nagardas Rd</text>`;
    s += `<g id="routeHere"></g></svg>`;
    $('route').innerHTML = s;
    $('route').querySelectorAll('.hit').forEach(el => {
      const i = +el.dataset.bin;
      el.addEventListener('mouseenter', e => tipShow(e, tipText(i)));
      el.addEventListener('mousemove', tipMove);
      el.addEventListener('mouseleave', tipHide);
      el.addEventListener('click', () => select(i * BIN + BIN / 2, true));
    });
    $('rampKey').innerHTML = `<span class="sw">${RAMP.map(c => `<i style="background:${c}"></i>`).join('')}</span><span>days blocked: none → every day</span><span style="color:var(--muted)">Inner line A side, outer B side. Schematic.</span>`;
  }
  function routeCursor(m) {
    const q = routeAt(m), g = $('routeHere'); if (!g) return;
    g.innerHTML = `<circle cx="${q.x}" cy="${q.y}" r="15" fill="none" stroke="var(--fg)" stroke-width="2"/>`;
  }

  /* ---------- Tooltip ---------- */
  const tip = $('tip');
  function tipShow(e, html) { tip.innerHTML = html; tip.hidden = false; tipMove(e); }
  function tipMove(e) { tip.style.left = Math.min(window.innerWidth - 290, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; }
  function tipHide() { tip.hidden = true; }
  function tipText(i) {
    const A = persistence('forward')[i], B = persistence('return')[i];
    return `${range(i)}${nearLandmark(i) ? ' · ' + nearLandmark(i) : ''}<br>A side: blocked ${A.c}/${A.n} days<br>B side: blocked ${B.c}/${B.n} days`;
  }

  /* ---------- Spot x day grid ---------- */
  const MX = { left: 132, top: 38, cw: 0, rh: 22, gap: 3, W: 1000 };
  function renderMatrix() {
    MX.cw = (MX.W - MX.left - 8) / NB;
    const rows = [];
    SIDES.forEach(side => {
      rows.push({ type: 'group', label: `${side.name.toUpperCase()} · ${side.walk}` });
      days.forEach(d => { if (d[side.key]) rows.push({ type: 'day', d, side }); });
      rows.push({ type: 'sum', side });
    });
    let y = MX.top, cells = '', labels = '';
    rows.forEach((r, ri) => {
      if (r.type === 'group') { y += ri ? 16 : 0; labels += `<text class="grp" x="0" y="${y + 14}">${r.label}</text>`; y += 20; return; }
      if (r.type === 'day') {
        const w = walk(r.d, r.side.key);
        labels += `<text class="rowlab" x="0" y="${y + 15}">Day ${r.d.day}</text><text x="52" y="${y + 15}" style="fill:var(--muted)">${light(r.d[r.side.key])}</text>`;
        for (let i = 0; i < NB; i++) {
          const b = binWorst(w, i), v = b ? b.obstruction : null;
          cells += `<rect x="${MX.left + i * MX.cw + 1}" y="${y}" width="${MX.cw - 2}" height="${MX.rh}" rx="2" fill="${stateColor(v)}" ${v == null ? 'stroke="var(--line)"' : ''}/>`;
        }
      } else {
        y += 4;
        labels += `<text class="rowlab" x="0" y="${y + 15}" style="font-weight:600">Days blocked</text>`;
        const per = persistence(r.side.key);
        for (let i = 0; i < NB; i++) {
          const p = per[i];
          cells += `<rect x="${MX.left + i * MX.cw + 1}" y="${y}" width="${MX.cw - 2}" height="${MX.rh}" rx="2" fill="${p.n ? shareColor(p.c, p.n) : 'none'}"/>`;
          cells += `<text x="${MX.left + i * MX.cw + MX.cw / 2}" y="${y + 15}" text-anchor="middle" style="fill:${p.n && p.c / p.n > .5 ? 'var(--bg)' : 'var(--fg)'}">${p.n ? p.c : ''}</text>`;
        }
      }
      y += MX.rh + MX.gap;
    });
    const H = y + 4;
    let axis = '';
    for (let m = 0; m < L; m += 50) axis += `<text x="${MX.left + m / BIN * MX.cw}" y="12" text-anchor="${m ? 'middle' : 'start'}">${m}</text>`;
    axis += `<text x="${MX.left + L / BIN * MX.cw}" y="12" text-anchor="end">${fmt(L)} m</text>`;
    landmarks.forEach(l => { const x = MX.left + l.m / BIN * MX.cw; axis += `<line x1="${x}" x2="${x}" y1="18" y2="${H}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${x + 3}" y="30" style="fill:var(--muted);font-size:10px">${l.name}</text>`; });
    let hits = '';
    for (let i = 0; i < NB; i++) hits += `<rect class="col" data-bin="${i}" x="${MX.left + i * MX.cw}" y="${MX.top}" width="${MX.cw}" height="${H - MX.top}" fill="transparent" tabindex="0" aria-label="${range(i)}"/>`;
    const key = `<g transform="translate(0 ${H + 8})"><rect x="0" y="0" width="12" height="12" rx="2" fill="var(--r0)"/><text x="17" y="10">clear</text><rect x="64" y="0" width="12" height="12" rx="2" fill="var(--r1)"/><text x="81" y="10">busy</text><rect x="124" y="0" width="12" height="12" rx="2" fill="var(--r4)"/><text x="141" y="10">obstructed</text><text x="232" y="10" style="fill:var(--muted)">per day, worst frame looking at the spot</text></g>`;
    $('matrix').innerHTML = `<svg viewBox="0 0 ${MX.W} ${H + 26}" role="img" aria-label="Grid of 10 m spots by day and side">${axis}${labels}${cells}${hits}<rect class="colsel" id="colsel" x="0" y="${MX.top - 2}" width="0" height="${H - MX.top + 2}" rx="3"/>${key}</svg>`;
    $('matrix').querySelectorAll('.col').forEach(el => {
      const i = +el.dataset.bin;
      el.addEventListener('click', () => select(i * BIN + BIN / 2, true));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(i * BIN + BIN / 2, true); } });
      el.addEventListener('mouseenter', e => tipShow(e, tipText(i)));
      el.addEventListener('mousemove', tipMove);
      el.addEventListener('mouseleave', tipHide);
    });
  }
  function matrixCursor(m) {
    const r = $('colsel'); if (!r) return;
    r.setAttribute('x', MX.left + binOf(m) * MX.cw); r.setAttribute('width', MX.cw);
  }

  /* ---------- Ranked spots ---------- */
  let showAll = false;
  function spotRows() {
    const A = persistence('forward'), B = persistence('return'), sh = p => p.n ? p.c / p.n : 0;
    return [...Array(NB).keys()].map(i => ({ i, A: A[i], B: B[i], score: sh(A[i]) + sh(B[i]) })).sort((a, b) => b.score - a.score || a.i - b.i);
  }
  function stripFor(key, i) {
    return `<span class="strip">${days.map(d => { const w = walk(d, key); if (!w) return '<i class="na"></i>'; const b = binWorst(w, i); return `<i style="background:${b ? stateColor(b.obstruction) : 'transparent'}" title="Day ${d.day}: ${stateWord(b && b.obstruction)}"></i>`; }).join('')}</span>`;
  }
  function renderSpots() {
    const rows = spotRows(), shown = showAll ? rows : rows.slice(0, 8);
    const latest = days[days.length - 1];
    $('spotList').innerHTML = `<table class="spots"><thead><tr><th></th><th>Spot</th><th></th><th>A side by day</th><th>B side by day</th><th>Likely response</th><th></th></tr></thead><tbody>
      ${shown.map((r, k) => `<tr data-bin="${r.i}"><td class="rk">${k + 1}</td>
        <td class="where"><span class="mono">${range(r.i)}</span>${nearLandmark(r.i) ? `<small>${nearLandmark(r.i)}</small>` : ''}</td>
        <td>${photo(walk(latest, 'forward') || walk(latest, 'return'), r.i * BIN + BIN / 2, 'thumb')}</td>
        <td>${stripFor('forward', r.i)}<span class="mono">${r.A.c}/${r.A.n}</span></td>
        <td>${stripFor('return', r.i)}<span class="mono">${r.B.c}/${r.B.n}</span></td>
        <td class="resp">${respFor(r.A, r.B)}</td>
        <td><button class="linkbtn" data-card="${r.i}">Evidence card</button></td></tr>`).join('')}</tbody></table>`;
    $('moreSpots').textContent = showAll ? 'Show top 8' : `Show all ${rows.length}`;
    $('spotList').querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', e => {
      const i = +tr.dataset.bin;
      if (e.target.closest('[data-card]')) { openCard(i); return; }
      select(i * BIN + BIN / 2, true);
    }));
    highlightRow(state.meter);
  }
  $('moreSpots').addEventListener('click', () => { showAll = !showAll; renderSpots(); });
  function highlightRow(m) {
    $('spotList').querySelectorAll('tr.on').forEach(t => t.classList.remove('on'));
    const tr = $('spotList').querySelector(`tr[data-bin="${binOf(m)}"]`); if (tr) tr.classList.add('on');
  }

  /* ---------- Photo tracks ---------- */
  let ppm = 12;
  function trackRows() {
    if (state.cmp === 'days') {
      const s = SIDES.find(x => x.key === state.side);
      return days.filter(d => d[s.key]).map(d => ({ d, s, label: `Day ${d.day} · ${light(d[s.key])}` }));
    }
    const d = days[state.dayIdx];
    return SIDES.filter(s => d[s.key]).map(s => ({ d, s, label: `${s.name} · ${light(d[s.key])}` }));
  }
  function renderTracks() {
    const rows = state.rows = trackRows();
    $('sideSeg').hidden = state.cmp !== 'days';
    $('daySeg').hidden = state.cmp !== 'dirs';
    $('daySeg').innerHTML = days.map((d, k) => `<button data-day="${k}" aria-pressed="${k === state.dayIdx}">Day ${d.day}</button>`).join('');
    $('daySeg').querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => { state.dayIdx = +b.dataset.day; renderTracks(); select(state.meter, true); }));
    document.querySelectorAll('[data-cmp]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cmp === state.cmp));
    document.querySelectorAll('[data-side]').forEach(b => b.setAttribute('aria-pressed', b.dataset.side === state.side));
    $('trackNote').textContent = state.cmp === 'days'
      ? 'Each row is one day from the same side, so photos in a column show the same spot on different days.'
      : 'One day from both sides. Photos in a column show the same spot from opposite directions, so the scenery differs.';
    const h = 118, thumbW = h * 9 / 16;
    const spacing = Math.min(10, ...rows.map(r => { const w = walk(r.d, r.s.key); return w && w.nodes.length > 1 ? L / (w.nodes.length - 1) : 10; }));
    ppm = Math.max(6, Math.min(40, (thumbW + 4) / spacing));
    const W = L * ppm + 100, x = m => 50 + m * ppm;
    let html = `<div class="cursor" id="tCursor"></div><div class="axis" style="width:${W}px">`;
    for (let m = 0; m <= L; m += 10) html += `<div class="t" style="left:${x(m)}px;${m % 50 ? 'height:3px' : ''}"></div>` + (m % 50 ? '' : `<div class="l" style="left:${x(m)}px">${m} m</div>`);
    html += `</div>`;
    rows.forEach((r, i) => {
      const w = walk(r.d, r.s.key);
      html += `<div class="trk" style="width:${W}px"><span class="lab">${r.label}</span>`;
      if (w) for (const n of w.nodes) html += `<button class="node" style="left:${x(n.meter)}px" data-row="${i}" data-m="${n.meter}" aria-label="${r.label}, ${fmt(n.meter)} m"><img src="${w.folder}/${n.file}" alt="" loading="lazy" decoding="async" style="height:${h}px"></button>`;
      html += `</div>`;
    });
    $('canvas').innerHTML = html;
    $('canvas').style.width = W + 'px';
    $('canvas').querySelectorAll('.node').forEach(el => {
      el.addEventListener('mouseenter', () => select(+el.dataset.m));
      el.addEventListener('focus', () => select(+el.dataset.m));
    });
    state.x = x;
  }
  document.querySelectorAll('[data-cmp]').forEach(b => b.addEventListener('click', () => { state.cmp = b.dataset.cmp; renderTracks(); select(state.meter, true); }));
  document.querySelectorAll('[data-side]').forEach(b => b.addEventListener('click', () => { state.side = b.dataset.side; renderTracks(); select(state.meter, true); }));
  function tracksCursor(m, scroll) {
    document.querySelectorAll('.node.hot').forEach(n => n.classList.remove('hot'));
    state.rows.forEach((r, i) => {
      const n = nearest(walk(r.d, r.s.key), m); if (!n) return;
      const el = document.querySelector(`.node[data-row="${i}"][data-m="${n.meter}"]`); if (el) el.classList.add('hot');
    });
    const c = $('tCursor'); if (c) { c.style.left = state.x(m) + 'px'; c.style.display = 'block'; }
    if (scroll) { const t = $('tracks'); t.scrollLeft = state.x(m) - t.clientWidth / 2; }
  }

  /* ---------- Inspector ---------- */
  function renderInspector(m) {
    const i = binOf(m), S = i * BIN + BIN / 2;
    const per = { forward: persistence('forward')[i], return: persistence('return')[i] };
    const sideHtml = side => {
      const p = per[side.key];
      const tiles = days.filter(d => d[side.key]).map(d => {
        const w = walk(d, side.key), b = binWorst(w, i), v = b ? b.obstruction : null;
        return `<figure>${photo(w, S)}<figcaption><i style="background:${stateColor(v)}"></i>Day ${d.day}${light(w) === 'night' ? ' · night' : ''}</figcaption></figure>`;
      }).join('');
      return `<div class="side"><div class="side-head"><b>${side.name}</b><span class="mono" style="color:var(--fg-2)">blocked ${p.c}/${p.n} days</span></div>
        ${tiles ? `<div class="days">${tiles}</div>` : '<span class="note">No footage from this side.</span>'}</div>`;
    };
    const a = per.forward, b = per.return;
    const word = p => p.cls === 'every' ? 'blocked every day' : p.cls === 'some' ? 'blocked on some days' : p.cls === 'clear' ? 'clear every day' : 'too few days';
    const verdict = a.cls === b.cls ? `Both sides ${word(a)}.` : `A side ${word(a)}; B side ${word(b)}.`;
    const resp = respFor(a, b);
    $('inspector').innerHTML = `
      <div class="insp-top"><span class="m">${range(i)}</span><span class="note">${nearLandmark(i)}</span></div>
      ${SIDES.map(sideHtml).join('')}
      <div class="verdict">${verdict}${resp ? `<br><span style="color:var(--fg-2)">${resp}</span>` : ''}</div>
      <button class="btn" id="inspCard">Evidence card</button>`;
    $('inspCard').addEventListener('click', () => openCard(i));
  }

  /* ---------- Selection ---------- */
  function select(m, scroll) {
    state.meter = m;
    routeCursor(m); matrixCursor(m); highlightRow(m); tracksCursor(m, scroll); renderInspector(m);
  }

  /* ---------- Look-ahead calibration ---------- */
  $('look').value = LOOK; $('lookVal').textContent = fmt(LOOK, 1) + ' m';
  $('look').addEventListener('input', () => {
    LOOK = +$('look').value; vcache = new WeakMap(); pcache = {};
    $('lookVal').textContent = fmt(LOOK, 1) + ' m';
    try { localStorage.setItem('si-look', LOOK); } catch (e) {}
    renderAll();
  });

  /* ---------- Method ---------- */
  $('method').innerHTML = [
    ['Walks', `A phone at chest height films the ${fmt(L)} m footpath in both directions on each survey day. A frame is kept every ${D.corridor.step_s} s of walking; pauses are skipped.`],
    ['Position', 'Pinned to landmarks read off Google Maps and interpolated by walking time. Later days are matched to earlier ones by appearance. About ±10 m.'],
    ['Obstruction', `Edge density in the walking zone of each frame, against the typical frame of all walks in the same direction and light. Above ${OBS} counts as obstructed. An image measure, not a width.`],
    ['Spots', `${BIN} m stretches. A spot is blocked on a day if any frame looking at it is obstructed. Photos show the spot from about ${fmt(LOOK, 1)} m away.`],
    ['Light', 'Most B→A walks were filmed at night. Day and night are scored separately, but some B-side change may be light rather than obstruction.'],
    ['Not yet', 'The measure is not yet checked against hand labels. The route is a schematic. Faces are not blurred.']
  ].map(([k, v]) => `<div><b>${k}</b>${v}</div>`).join('');

  /* ---------- Evidence card (canvas: the preview is the saved image) ---------- */
  const imgCache = {};
  const loadImg = src => imgCache[src] || (imgCache[src] = new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }));
  let cardText = '', cardName = 'evidence.png';
  async function openCard(i) {
    const S = i * BIN + BIN / 2;
    const per = { forward: persistence('forward')[i], return: persistence('return')[i] };
    $('cardTitle').textContent = `Evidence card · ${range(i)}`;
    $('cardMsg').textContent = '';
    if (!$('cardDlg').open) $('cardDlg').showModal();
    const cv = $('cardCanvas'), ctx = cv.getContext('2d');
    const W = 1200, pad = 48, tw = 150, th = 267, gap = 14;
    const H = 196 + SIDES.length * (th + 108) + 110;
    cv.width = W; cv.height = H;
    const C = { ink: '#141816', mid: '#4a524e', mute: '#727a76', line: '#d6d9d5', r0: '#e3e6e2', r1: '#f1cbbd', r4: '#8c2915' };
    const F = (w, sz, fam = 'Barlow, system-ui, sans-serif') => `${w} ${sz}px ${fam}`;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = C.ink; ctx.font = F(700, 38, '"Barlow Semi Condensed", Barlow, sans-serif');
    ctx.fillText(`${range(i)}${nearLandmark(i) ? ' · ' + nearLandmark(i) : ''}`, pad, 74);
    ctx.fillStyle = C.mid; ctx.font = F(400, 18);
    ctx.fillText(`Jijamata Rd / Old Nagardas Rd, Andheri East · BMC ward ${D.corridor.ward || ''} · ${fmt(L)} m footpath walked both ways on ${days.length} days`, pad, 108);
    ctx.strokeStyle = C.line; ctx.beginPath(); ctx.moveTo(pad, 136); ctx.lineTo(W - pad, 136); ctx.stroke();
    let y = 176;
    for (const side of SIDES) {
      const p = per[side.key];
      ctx.fillStyle = C.ink; ctx.font = F(600, 20); ctx.fillText(side.name, pad, y);
      ctx.fillStyle = C.mid; ctx.font = F(400, 18); ctx.fillText(`blocked on ${p.c} of ${p.n} days`, pad + 90, y);
      y += 16;
      const items = days.filter(d => d[side.key]);
      for (let k = 0; k < items.length; k++) {
        const d = items[k], w = walk(d, side.key), v = viewFor(w, S), b = binWorst(w, i), x = pad + k * (tw + gap);
        ctx.fillStyle = C.r0; ctx.fillRect(x, y, tw, th);
        try {
          if (v) {
            const sv = w.spot_views, sh = Math.floor(v.idx / sv.per_sheet), kk = v.idx % sv.per_sheet, [fw, fh] = sv.size;
            ctx.drawImage(await loadImg(`${w.folder}/${sv.sheets[sh]}`), (kk % sv.cols) * fw, Math.floor(kk / sv.cols) * fh, fw, fh, x, y, tw, th);
          }
        } catch (e) {}
        const val = b ? b.obstruction : null;
        ctx.fillStyle = val == null ? C.line : val >= OBS ? C.r4 : val >= BUSY ? C.r1 : C.r0;
        ctx.fillRect(x, y + th + 8, tw, 8);
        ctx.fillStyle = C.ink; ctx.font = F(600, 15); ctx.fillText(`Day ${d.day}`, x, y + th + 36);
        ctx.fillStyle = C.mute; ctx.font = F(400, 14); ctx.fillText(`${light(w)} · ${stateWord(val)}`, x, y + th + 56);
      }
      y += th + 92;
    }
    const resp = respFor(per.forward, per.return);
    if (resp) { ctx.fillStyle = C.ink; ctx.font = F(600, 18); ctx.fillText(resp, pad, y + 6); }
    ctx.fillStyle = C.mute; ctx.font = F(400, 14);
    ctx.fillText('Bar under each photo: walking zone clear, busy or obstructed (an image measure, not a width). Positions ±10 m.', pad, y + 32);
    ctx.fillText(`Street Intelligence · M.Des Stage 2 · ${new Date().toISOString().slice(0, 10)}`, pad, y + 54);
    cardName = `evidence-${i * BIN}-${Math.min(L, (i + 1) * BIN)}m.png`;
    cardText = [`${range(i)}${nearLandmark(i) ? ' (' + nearLandmark(i) + ')' : ''}, Jijamata Rd / Old Nagardas Rd, Andheri East, ward ${D.corridor.ward || ''}`,
      ...SIDES.map(side => `${side.name}: blocked on ${per[side.key].c} of ${per[side.key].n} days (${days.filter(d => d[side.key]).map(d => { const b = binWorst(walk(d, side.key), i); return `Day ${d.day} ${light(d[side.key])}: ${stateWord(b && b.obstruction)}`; }).join('; ')})`),
      resp, 'Method: phone video, both directions daily; obstruction is an image measure; positions ±10 m.'].filter(Boolean).join('\n');
  }
  $('closeCard').addEventListener('click', () => $('cardDlg').close());
  $('copyCard').addEventListener('click', () => navigator.clipboard.writeText(cardText).then(() => $('cardMsg').textContent = 'Copied.', () => $('cardMsg').textContent = 'Copy is blocked in this view.'));
  $('saveCard').addEventListener('click', async () => {
    const blob = await new Promise(res => $('cardCanvas').toBlob(res, 'image/png'));
    let downloads = null;
    try { downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
    if (downloads) {
      try { await downloads.save({ filename: cardName, data: blob }); $('cardMsg').textContent = 'Saved.'; }
      catch (e) { $('cardMsg').textContent = e && e.code === 'declined' ? 'Not saved.' : 'Saving is unavailable here; right-click the image to save it.'; }
      return;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = cardName;
    document.body.appendChild(a); a.click(); a.remove();
  });

  /* ---------- Go ---------- */
  function renderAll() { renderNums(); renderRoute(); renderMatrix(); renderSpots(); renderTracks(); select(state.meter); }
  state.meter = spotRows()[0].i * BIN + BIN / 2;   // open on the worst spot
  renderAll();
})();
</script>
</body>
