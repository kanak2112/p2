<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedestrian Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=Playfair+Display:ital@0;1&display=swap">
<style>
:root{--ink:#161616;--ink2:#525252;--ink3:#8d8d8d;--line:#e0e0e0;--bg:#fafafa;--card:#fff;--y:#F2B800;--yd:#966C00;--tint:#FEF7DE;
--red:#D9483B;--amb:#E9A21B;--teal:#1AA6A0;--navy:#1E2A4A;--nvoid:#DCE3F2;--fix:#2563EB;--veh:#E46B1E;--ppl:#D9A70F;--na:#e4e4e4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
.num{font-family:"IBM Plex Mono",monospace}
header{padding:20px 28px 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font:400 34px/1.1 "Playfair Display",serif;margin:0}
h1 i{color:var(--yd)}
.sub{color:var(--ink2);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:8px 28px}
.seg{display:inline-flex;flex-wrap:wrap;background:#ececec;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font:500 13px "IBM Plex Sans";color:var(--ink2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.lbl{font:600 11px "IBM Plex Sans";letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 9px;font:500 12px "IBM Plex Sans";cursor:pointer;color:var(--ink2)}
.chip.on{border-color:var(--ink);color:var(--ink)}
.chip.night.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip:not(.on){opacity:.45;text-decoration:line-through}
main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:8px 28px 28px;align-items:start}
@media(max-width:1100px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
#viewTitle{font:400 24px "Playfair Display",serif;margin:0 0 2px}
#viewNote{color:var(--ink2);font-size:14px;margin:0 0 10px;max-width:110ch}
#map{width:100%;height:auto;display:block;user-select:none}
#map text{font-family:"IBM Plex Sans";}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:12px;display:inline-block;border:1px solid #bdbdbd}
.caveat{font-size:12px;color:var(--ink3);margin-top:6px}
#insp h3{margin:0;font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#insp .big{font:600 34px/1 "IBM Plex Mono";margin:6px 0 2px}
#insp .row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;font-size:14px}
#insp .row b{font-family:"IBM Plex Mono";font-weight:600}
.pill{font:600 12px "IBM Plex Sans";padding:2px 8px;border-radius:99px}
.pill.bad{background:#fbe4e1;color:var(--red)}.pill.warn{background:#fdf0d5;color:#a86f00}.pill.ok{background:#dff3f2;color:#137d78}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.ph{position:relative;aspect-ratio:240/427;border-radius:10px;overflow:hidden;background:#eee}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{position:absolute;inset:0;width:100%;height:100%}
.ph figcaption{font-size:11px;color:var(--ink3)}
.kinds{display:grid;gap:4px;margin-top:8px}
.kind{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:12px}
.meter{height:6px;border-radius:3px;background:#eee;overflow:hidden}.meter i{display:block;height:100%}
input[type=range]{accent-color:var(--yd)}
.hint{font-size:12px;color:var(--ink3)}
</style>
</head>
<body>
<header>
  <h1>Pedestrian Map <i>· Old Nagardas Rd</i></h1>
  <span class="sub">Andheri East · 220 m · 15 walks (11 by day, 4 at night), Oct 2026 · the street as a walker meets it</span>
</header>
<div class="bar">
  <span class="lbl">Map</span>
  <div class="seg" id="views"></div>
</div>
<div class="bar">
  <span class="lbl">Walks</span>
  <div class="seg" id="dir"><button data-v="both">Both</button><button data-v="f">A → B</button><button data-v="r">B → A</button></div>
  <div class="chips" id="chips"></div>
  <span id="thrWrap" hidden><span class="lbl">Needs at least</span> <input id="thr" type="range" min="0.6" max="1.8" step="0.1" value="0.9"> <b class="num" id="thrV">0.9 m</b></span>
</div>
<main>
  <section class="card">
    <h2 id="viewTitle"></h2>
    <p id="viewNote"></p>
    <svg id="map" viewBox="0 0 1900 700"></svg>
    <div class="legend" id="legend"></div>
    <div class="caveat" id="caveat"></div>
  </section>
  <aside class="card" id="insp"></aside>
</main>
<script src="../lab/data.js"></script>
<script>
'use strict';
const D = window.LAB, NB = 22, L = 220, OBS = 1.4, NA = i => i >= 16 && i <= 18;
const C = { ink:'#161616', ink2:'#525252', ink3:'#8d8d8d', red:'#D9483B', amb:'#E9A21B', teal:'#1AA6A0', navy:'#1E2A4A', nvoid:'#DCE3F2', fix:'#2563EB', veh:'#E46B1E', ppl:'#D9A70F', yd:'#966C00', na:'#e4e4e4' };
const LM = [[80,'green bins'],[104,'turn onto highway service rd'],[162,'underpass walkway 162–191 m']];
const X0 = 150, PX = 5, W10 = 10 * PX;                   // 5 px per metre, 50 px per 10 m
const med = a => { const s = a.slice().sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; };
const walks = D.walks.map((w, k) => ({ ...w, k, label: `Day ${w.day} · ${w.dir === 'forward' ? 'A→B' : 'B→A'}${w.night ? ' · night' : ''}` }));
const state = { view: 'nolli', dir: 'both', on: new Set(walks.map(w => w.k)), thr: 0.9, sel: 8 };
const topOf = e => { if (!e) return .5; const a = e[0], b = 1 - e[1]; return a + b > .02 ? a / (a + b) : .5; };

function sel() { return walks.filter(w => state.on.has(w.k) && (state.dir === 'both' || (state.dir === 'f') === (w.dir === 'forward'))); }
function stats() {
  const W = sel(), day = W.filter(w => !w.night), night = W.filter(w => w.night);
  return Array.from({ length: NB }, (_, i) => {
    const dr = day.map(w => w.s[i]).filter(Boolean), nr = night.map(w => w.s[i]).filter(Boolean), all = W.map(w => w.s[i]).filter(Boolean);
    const gs = dr.filter(r => r.g > 0).map(r => r.g), ngs = nr.filter(r => r.g > 0).map(r => r.g), es = dr.filter(r => r.e).map(r => r.e);
    const share = k => dr.length ? dr.filter(r => r.ks.includes(k)).length / dr.length : 0;
    const sh = { fixed: Math.max(share('pole'), share('plants'), share('barrier')), vehicle: share('vehicle'), people: share('people') };
    return {
      i, g: NA(i) || !gs.length ? null : med(gs), gN: gs.length, ok: gs.filter(g => g >= state.thr).length,
      ng: NA(i) || ngs.length < 2 ? null : med(ngs), ngN: ngs.length,
      top: es.length ? topOf([med(es.map(e => e[0])), med(es.map(e => e[1]))]) : .5,
      b: all.filter(r => r.o >= OBS).length, n: all.length,
      sw: W.filter(w => w.swerves.some(m => m >= i * 10 && m < i * 10 + 10)).length,
      hk: W.reduce((s, w) => s + w.honks.filter(m => m >= i * 10 && m < i * 10 + 10).length, 0),
      lit: D.lit[i] ? D.lit[i].r : null, sh, nDay: dr.length,
      persistent: sh.vehicle >= .6 || sh.people >= .9, fixedOn: sh.fixed >= .4 || NA(i) || i === 8
    };
  });
}

// ---------- svg helpers
const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('map');
function el(tag, at, parent = svg) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); parent.appendChild(e); return e; }
function txt(s, x, y, at = {}) { const t = el('text', { x, y, 'font-size': 13, fill: C.ink2, ...at }); t.textContent = s; return t; }
const xm = m => X0 + m * PX;
function axis(y) {
  for (let m = 0; m <= L; m += 10) { const big = m % 50 === 0 || m === L; el('line', { x1: xm(m), x2: xm(m), y1: y, y2: y + (big ? 9 : 5), stroke: C.ink3 }); if (big) txt(m + ' m', xm(m), y + 22, { 'text-anchor': 'middle', 'font-size': 11, fill: C.ink3 }); }
}
function landmarks(y) { LM.forEach(([m, l], k) => { el('circle', { cx: xm(m), cy: y - 8, r: 3.5, fill: C.ink }); txt(l, xm(m) + 7, y - 4, { 'font-size': 13, 'font-weight': 500, fill: C.ink }); }); }
function strip(y, h, cells, solid, voidc) {  // cells: [{g, top, na, few}]
  el('rect', { x: X0, y, width: NB * W10, height: h, fill: solid });
  cells.forEach((c, i) => {
    const x = X0 + i * W10;
    if (c.na) { el('rect', { x, y, width: W10, height: h, fill: C.na }); el('line', { x1: x + 4, y1: y + h - 4, x2: x + W10 - 4, y2: y + 4, stroke: '#bdbdbd' }); return; }
    if (c.few) { el('rect', { x, y, width: W10, height: h, fill: '#c9ced8' }); return; }
    if (c.miss) { el('rect', { x, y, width: W10, height: h, fill: '#d9d9d9' }); return; }
    if (c.g == null) return;
    const gg = Math.min(3, c.g), rest = 3 - gg;
    el('rect', { x, y: y + rest * c.top * h / 3, width: W10, height: gg * h / 3, fill: voidc, opacity: c.op ?? 1 });
  });
}
function rowLabel(s, y, sub) { txt(s, 0, y, { 'font-size': 13, 'font-weight': 600, fill: C.ink }); if (sub) txt(sub, 0, y + 16, { 'font-size': 11, fill: C.ink3 }); }
function hit(y0, y1, S) {
  for (let i = 0; i < NB; i++) {
    const r = el('rect', { x: X0 + i * W10, y: y0, width: W10, height: y1 - y0, fill: 'transparent', style: 'cursor:pointer' });
    r.addEventListener('mouseenter', () => inspect(S, i)); r.addEventListener('click', () => { state.sel = i; render(); });
  }
  const s = state.sel; el('rect', { x: X0 + s * W10, y: y0 - 2, width: W10, height: y1 - y0 + 4, fill: 'none', stroke: C.yd, 'stroke-width': 3, rx: 4, 'pointer-events': 'none' });
}
const cls = g => g == null ? null : g >= 1.5 ? C.teal : g >= .9 ? C.amb : C.red;

// ---------- views
const VIEWS = {
  nolli: { t: 'Pedestrian Nolli', n: 'Solid = what takes the footpath. Void = the width you can walk, measured per 10 m. Top edge = building line, bottom = kerb: each solid sits on the side it was seen. Below, one strip per walk; a red edge means that walk was blocked there.', draw(S) {
    const W = sel(), AH = 170, y = 76;
    rowLabel('Daytime median', y + AH / 2 - 8, `${W.filter(w => !w.night).length} walks`);
    strip(y, AH, S.map(s => ({ g: s.g, top: s.top, na: NA(s.i) })), C.ink, '#fff');
    txt('building line ↑', X0 + NB * W10 + 8, y + 12, { 'font-size': 11, fill: C.ink3 }); txt('kerb · road ↓', X0 + NB * W10 + 8, y + AH - 4, { 'font-size': 11, fill: C.ink3 });
    S.forEach(s => { if (s.g != null && s.g < .9) { const cx = X0 + s.i * W10 + W10 / 2; el('line', { x1: cx, x2: cx, y1: y - 16, y2: y + AH, stroke: C.red, 'stroke-width': 2 }); el('circle', { cx, cy: y - 18, r: 5, fill: C.red }); txt(`${s.g.toFixed(1)} m · you step into the road`, cx + 9, y - 13, { fill: C.red, 'font-weight': 600, 'font-size': 13 }); } });
    S.forEach(s => txt(`${s.b}/${s.n}`, X0 + s.i * W10 + W10 / 2, y + AH + 18, { 'text-anchor': 'middle', 'font-size': 11, fill: s.n && s.b / s.n >= .7 ? C.red : C.ink3, 'font-weight': s.n && s.b / s.n >= .7 ? 600 : 400 }));
    txt('blocked', X0 - 8, y + AH + 18, { 'text-anchor': 'end', 'font-size': 11, fill: C.ink3 });
    let wy = y + AH + 40; axis(wy); wy += 40;
    const segE = S.map(s => s.top);
    W.forEach(w => { const h = 18; txt(w.label, 0, wy + 13, { 'font-size': 12, fill: w.night ? C.navy : C.ink2 });
      strip(wy, h, w.s.map((r, i) => ({ g: r && r.g > 0 ? r.g : null, top: r && r.e ? topOf(r.e) : segE[i], miss: !r || !(r.g > 0) })), w.night ? C.navy : C.ink, w.night ? C.nvoid : '#fff');
      w.s.forEach((r, i) => { if (r && r.o >= OBS) el('rect', { x: X0 + i * W10, y: wy, width: W10, height: 3, fill: C.red }); }); wy += h + 4; });
    hit(y, wy, S); landmarks(24); return wy + 10;
  }, legend: [['#161616', 'solid: what takes the footpath'], ['#fff', 'void: walkable width (to 3 m)'], ['#1E2A4A', 'night walk'], ['#e4e4e4', 'not measurable'], ['bar:#D9483B', 'blocked on that walk']] },

  ghost: { t: 'Ghost Nolli', n: 'Every selected daytime walk drawn on top of the others, each as a faint white band. Bright white = free on most walks. Grey = free on some walks, taken on others. It shows how reliable the footpath is, not one moment.', draw(S) {
    const day = sel().filter(w => !w.night), y = 60, H = 330;
    rowLabel('All walks', y + H / 2 - 8, `${day.length} daytime`);
    el('rect', { x: X0, y, width: NB * W10, height: H, fill: C.ink });
    for (let i = 0; i < NB; i++) { const x = X0 + i * W10; if (NA(i)) { el('rect', { x, y, width: W10, height: H, fill: C.na }); continue; }
      day.forEach(w => { const r = w.s[i]; if (!r || !(r.g > 0)) return; const gg = Math.min(3, r.g), top = r.e ? topOf(r.e) : S[i].top; el('rect', { x, y: y + (3 - gg) * top * H / 3, width: W10, height: gg * H / 3, fill: '#fff', opacity: .2 }); }); }
    txt('building line ↑', X0 + NB * W10 + 8, y + 12, { 'font-size': 11, fill: C.ink3 }); txt('kerb · road ↓', X0 + NB * W10 + 8, y + H - 4, { 'font-size': 11, fill: C.ink3 });
    axis(y + H + 8); landmarks(40); hit(y, y + H, S); return y + H + 50;
  }, legend: [['#fff', 'bright: free on most walks'], ['#8a8a8a', 'grey: free on some walks'], ['#161616', 'black: taken on every walk'], ['#e4e4e4', 'not measurable']] },

  daynight: { t: 'Day / Night Nolli', n: 'The same footpath by day and at night. Night widths need at least 2 night photos in the stretch; otherwise it is marked “too few”. Below: how much darker each stretch is than the route’s typical night frame.', draw(S) {
    const y1 = 60, H = 170, y2 = y1 + H + 70;
    rowLabel('By day', y1 + H / 2 - 8, 'median'); rowLabel('At night', y2 + H / 2 - 8, 'median');
    strip(y1, H, S.map(s => ({ g: s.g, top: s.top, na: NA(s.i) })), C.ink, '#fff');
    strip(y2, H, S.map(s => ({ g: s.ng, top: s.top, na: NA(s.i), few: !NA(s.i) && s.ng == null })), C.navy, C.nvoid);
    axis(y1 + H + 10);
    const ly = y2 + H + 18; rowLabel('Night light', ly + 14);
    S.forEach(s => { if (s.lit == null) return; const x = X0 + s.i * W10, d = Math.max(0, 1 - s.lit); el('rect', { x, y: ly, width: W10 - 2, height: 26, fill: C.navy, opacity: Math.min(1, .08 + d * 2.2) }); if (s.lit < .85) txt(`${Math.round(d * 100)}% darker`, x + W10 / 2, ly + 44, { 'text-anchor': 'middle', 'font-size': 11, fill: C.navy, 'font-weight': 600 }); });
    landmarks(40); hit(y1, ly + 30, S); return ly + 60;
  }, legend: [['#161616', 'day: what takes the footpath'], ['#1E2A4A', 'night: what takes it'], ['#c9ced8', 'too few night photos'], ['#e4e4e4', 'not measurable']] },

  fills: { t: 'What fills the solid', n: 'The solid is split by what was seen there on the daytime walks: fixed things (poles, trees, walls, bins), vehicles, and people or stalls. Each colour’s share is how often it appeared. Tells you whose problem each stretch is.', draw(S) {
    const y = 60, H = 300; rowLabel('Daytime', y + H / 2 - 8, 'median');
    el('rect', { x: X0, y, width: NB * W10, height: H, fill: '#fff', stroke: C.ink, 'stroke-width': 1 });
    S.forEach(s => { const x = X0 + s.i * W10; if (NA(s.i)) { el('rect', { x, y, width: W10, height: H, fill: C.na }); el('line', { x1: x + 4, y1: y + H - 4, x2: x + W10 - 4, y2: y + 4, stroke: '#bdbdbd' }); return; } if (s.g == null) return;
      const gg = Math.min(3, s.g), rest = 3 - gg, ht = rest * s.top * H / 3, hb = rest * (1 - s.top) * H / 3;
      const parts = [['fixed', C.fix], ['vehicle', C.veh], ['people', C.ppl]].map(([k, c]) => [s.sh[k] + (k === 'fixed' && s.fixedOn ? .3 : 0), c]); const tot = parts.reduce((a, p) => a + p[0], 0) || 1;
      [[y, ht], [y + H - hb, hb]].forEach(([yy, hh]) => { let o = yy; parts.forEach(([v, c]) => { const h = hh * v / tot; el('rect', { x, y: o, width: W10, height: h, fill: c }); o += h; }); }); });
    axis(y + H + 8); landmarks(40); hit(y, y + H, S); return y + H + 50;
  }, legend: [['#2563EB', 'fixed: poles, trees, walls, bins'], ['#E46B1E', 'vehicles stopping or parked'], ['#D9A70F', 'people, crowds, stalls'], ['#fff', 'void: walkable width']] },

  layers: { t: 'The walker’s Nolli', n: 'Everything a person on foot meets, stacked on one street at the exact metre it was recorded: horns heard, places walkers swerved, the walkable width, and night light.', draw(S) {
    const W = sel(); let y = 60;
    rowLabel('Horns', y + 18, 'each tick = 1 horn'); W.forEach((w, k) => w.honks.forEach(m => el('line', { x1: xm(m), x2: xm(m), y1: y + k * 3, y2: y + k * 3 + 3, stroke: C.red, 'stroke-width': 2, opacity: .8 }))); y += Math.max(50, W.length * 3 + 14);
    rowLabel('Swerves', y + 18, 'each dot = 1 walk'); W.forEach((w, k) => w.swerves.forEach(m => el('circle', { cx: xm(m), cy: y + 4 + k * 3.2, r: 2.6, fill: C.yd }))); y += Math.max(56, W.length * 3.2 + 16);
    const H = 170; rowLabel('Walkable width', y + H / 2 - 8, 'daytime median'); strip(y, H, S.map(s => ({ g: s.g, top: s.top, na: NA(s.i) })), C.ink, '#fff'); const yS = y; y += H + 10;
    rowLabel('Night light', y + 14); S.forEach(s => { if (s.lit == null) return; el('rect', { x: X0 + s.i * W10, y, width: W10 - 2, height: 24, fill: C.navy, opacity: Math.min(1, .08 + Math.max(0, 1 - s.lit) * 2.2) }); }); y += 34;
    axis(y); landmarks(40); hit(60, y, S); return y + 40;
  }, legend: [['bar:#D9483B', 'horn'], ['dot:#966C00', 'swerve'], ['#161616', 'what takes the footpath'], ['#1E2A4A', 'darker at night']] },

  line: { t: 'Walk-line map', n: 'For anyone walking it: the street drawn like a metro line, coloured by how much width you get, with the moments you’ll notice on foot.', draw(S) {
    const Y = 420; S.forEach(s => { const x = X0 + s.i * W10, c = cls(s.g); el('rect', { x, y: Y - 10, width: W10 + .5, height: 20, fill: c || '#fff', stroke: c ? 'none' : '#bdbdbd', 'stroke-width': 2 }); });
    [[0, 'Start', 'R.K. Chouhan Communications'], [L, 'End', 'Amratlal G. Vasani']].forEach(([m, a, b]) => { el('circle', { cx: xm(m), cy: Y, r: 20, fill: C.ink }); el('circle', { cx: xm(m), cy: Y, r: 9, fill: '#fff' }); txt(a, xm(m), Y + 44, { 'text-anchor': 'middle', 'font-weight': 600, fill: C.ink, 'font-size': 15 }); txt(b, xm(m), Y + 62, { 'text-anchor': 'middle' }); });
    [[80, 'Green bins', 44], [104, 'Turn onto highway service road', 66]].forEach(([m, l, dy]) => { el('circle', { cx: xm(m), cy: Y, r: 13, fill: '#fff', stroke: C.ink, 'stroke-width': 4 }); txt(l, xm(m), Y + dy, { 'text-anchor': 'middle', 'font-weight': 600, fill: C.ink, 'font-size': 14 }); });
    el('rect', { x: xm(162), y: Y - 15, width: 29 * PX, height: 30, rx: 15, fill: '#fff', stroke: C.ink, 'stroke-width': 4 }); txt('Underpass walkway', xm(176.5), Y + 44, { 'text-anchor': 'middle', 'font-weight': 600, fill: C.ink, 'font-size': 14 });
    const m = S.filter(s => s.g != null); const worst = m.reduce((a, b) => b.g < a.g ? b : a), widest = m.reduce((a, b) => b.g > a.g ? b : a), swv = S.reduce((a, b) => b.sw > a.sw ? b : a), dark = S.filter(s => s.lit != null).reduce((a, b) => b.lit < a.lit ? b : a);
    const calls = [[worst, worst.g < .9 ? 'You step into the road' : 'Narrowest stretch', `${worst.g.toFixed(1)} m clear. Blocked on ${worst.b} of ${worst.n} walks.`, worst.g < .9 ? C.red : C.amb, 110],
      [swv, 'Walkers swerve here', `${swv.sw} of ${sel().length} walks turned aside at ${swv.i * 10}–${swv.i * 10 + 10} m.`, C.amb, 200],
      [widest, 'Widest stretch', `About ${widest.g.toFixed(1)} m clear.`, C.teal, 110],
      [dark, 'Darkest at night', `${Math.round((1 - dark.lit) * 100)}% darker than the route at night.`, C.navy, 200]];
    calls.sort((p, q) => p[0].i - q[0].i).forEach(([s, a, b, c], k) => { const cx = X0 + s.i * W10 + W10 / 2, yy = 40 + k * 90;
      el('line', { x1: cx, x2: cx, y1: yy + 60, y2: Y - 12, stroke: c, 'stroke-width': 2 }); el('rect', { x: cx - 14, y: yy - 24, width: 250, height: 84, rx: 10, fill: '#fff', stroke: c, 'stroke-width': 2 });
      txt(a, cx, yy, { 'font-weight': 600, fill: c, 'font-size': 16 }); b.match(/.{1,34}(\s|$)/g).slice(0, 2).forEach((ln, j) => txt(ln.trim(), cx, yy + 22 + j * 17, { 'font-size': 13 })); });
    hit(Y - 20, Y + 20, S); return Y + 90;
  }, legend: [['#1AA6A0', '1.5 m or more (meets BMC)'], ['#E9A21B', '0.9–1.5 m: tight'], ['#D9483B', 'under 0.9 m: you step into the road'], ['#fff', 'not measurable']] },

  through: { t: 'Can I get through?', n: 'For a wheelchair, a pram or a walking frame. Each square is 10 m: on how many of the selected daytime walks there was at least the width you need. Move the slider to change it.', draw(S) {
    const Y = 120, CW = W10 - 10; let a = 0, b = 0, c = 0;
    S.forEach(s => { const x = X0 + s.i * W10; let col = C.na, gl = '?'; if (!NA(s.i) && s.gN) { const r = s.ok / s.gN; if (r >= .75) { col = C.teal; gl = '✓'; a++; } else if (r >= .5) { col = C.amb; gl = '!'; b++; } else { col = C.red; gl = '✕'; c++; } }
      el('rect', { x, y: Y, width: CW, height: CW, rx: 12, fill: col }); txt(gl, x + CW / 2, Y + CW / 2 + 14, { 'text-anchor': 'middle', 'font-size': 40, 'font-weight': 600, fill: col === C.na ? C.ink3 : '#fff' });
      txt(NA(s.i) || !s.gN ? '–' : `${s.ok} of ${s.gN}`, x + CW / 2, Y + CW + 20, { 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 500 }); });
    axis(Y - 40); landmarks(Y - 50);
    const t = txt(`Of ${a + b + c} measured stretches, at ${state.thr.toFixed(1)} m you usually get through ${a}, sometimes ${b}, and rarely ${c}.`, X0, Y + CW + 80, { 'font-size': 26, fill: C.ink }); t.style.fontFamily = 'Playfair Display';
    hit(Y, Y + CW, S); return Y + CW + 110;
  }, legend: [['#1AA6A0', '✓ on 3 of 4 walks or more'], ['#E9A21B', '! on half to 3 of 4'], ['#D9483B', '✕ on fewer than half'], ['#e4e4e4', '? not measured']] }
};
const ORDER = [['nolli', 'Nolli'], ['ghost', 'Ghost'], ['daynight', 'Day / Night'], ['fills', 'What fills it'], ['layers', 'Walker’s layers'], ['line', 'Walk-line'], ['through', 'Can I get through?']];

// ---------- inspector
function inspect(S, i) {
  const s = S[i], ph = D.photos, dp = (ph.df[i] || ph.dr[i]), np = ph.nr[i];
  const pill = s.g == null ? '' : s.g >= 1.5 ? '<span class="pill ok">meets BMC 1.5 m</span>' : s.g >= .9 ? '<span class="pill warn">tight</span>' : '<span class="pill bad">you step into the road</span>';
  const photo = (p, cap) => p ? `<figure class="ph" style="margin:0"><img src="../lab/ph/${p.id}.jpg" alt="${cap}" onerror="this.style.opacity=0">${p.path && p.path.length > 5 ? `<svg viewBox="0 0 1 1" preserveAspectRatio="none"><polygon points="${p.path.map(q => q.join(',')).join(' ')}" fill="rgba(26,166,160,.35)" stroke="#1AA6A0" stroke-width=".008"/></svg>` : ''}</figure>` : '<div class="ph"></div>';
  const meter = (l, v, c) => `<div class="kind"><span>${l}</span><span class="meter"><i style="width:${Math.round(v * 100)}%;background:${c}"></i></span><span class="num">${Math.round(v * 100)}%</span></div>`;
  document.getElementById('insp').innerHTML = `<h3>CH 0+${String(i * 10).padStart(3, '0')} – 0+${String(i * 10 + 10).padStart(3, '0')}</h3>
    <div class="big">${s.g == null ? '—' : s.g.toFixed(1) + ' m'}</div><div>${NA(i) ? '<span class="pill">underpass: not measurable</span>' : pill}</div>
    <div class="photos">${photo(dp, 'Day')}${photo(np, 'Night')}</div><div style="display:flex;justify-content:space-between" class="hint"><span>worst day photo · walkable ground traced</span><span>night</span></div>
    <div class="row"><span>Blocked</span><b>${s.b} of ${s.n} walks</b></div>
    <div class="row"><span>Walkers swerved</span><b>${s.sw} walks</b></div>
    <div class="row"><span>Horns heard</span><b>${s.hk}</b></div>
    <div class="row"><span>Night width</span><b>${s.ng == null ? (s.ngN < 2 && !NA(i) ? 'too few photos' : '—') : s.ng.toFixed(1) + ' m'}</b></div>
    <div class="row"><span>Night light</span><b>${s.lit == null ? '—' : (s.lit < 1 ? Math.round((1 - s.lit) * 100) + '% darker' : Math.round((s.lit - 1) * 100) + '% brighter')}</b></div>
    <div class="kinds"><span class="lbl">Seen on daytime walks</span>${meter('fixed things', s.sh.fixed, C.fix)}${meter('vehicles', s.sh.vehicle, C.veh)}${meter('people / stalls', s.sh.people, C.ppl)}</div>
    <p class="hint">Hover any stretch; click to keep it.</p>`;
}

// ---------- render
function render() {
  const S = stats(), V = VIEWS[state.view];
  svg.innerHTML = ''; document.getElementById('viewTitle').textContent = V.t; document.getElementById('viewNote').textContent = V.n;
  const h = V.draw(S); svg.setAttribute('viewBox', `0 0 ${X0 + NB * W10 + 110} ${Math.max(300, h)}`);
  document.getElementById('legend').innerHTML = V.legend.map(([c, l]) => c.startsWith('bar:') ? `<span><i class="sw" style="height:4px;border:0;background:${c.slice(4)}"></i>${l}</span>` : c.startsWith('dot:') ? `<span><i class="sw" style="border-radius:50%;width:10px;height:10px;border:0;background:${c.slice(4)}"></i>${l}</span>` : `<span><i class="sw" style="background:${c}"></i>${l}</span>`).join('');
  document.getElementById('caveat').textContent = 'Widths are camera estimates from walk photos, not tape-measured; night widths are less reliable. Walked on one side only. Vertical scale exaggerated. Oct 2026.';
  document.getElementById('thrWrap').hidden = state.view !== 'through';
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.view));
  document.querySelectorAll('#dir button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.dir));
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', state.on.has(+c.dataset.k)));
  inspect(S, state.sel);
}
document.getElementById('views').innerHTML = ORDER.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join('');
document.getElementById('views').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.view = b.dataset.v; render(); } });
document.getElementById('dir').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.dir = b.dataset.v; render(); } });
document.getElementById('chips').innerHTML = walks.map(w => `<button class="chip${w.night ? ' night' : ''}" data-k="${w.k}" title="${w.date}">${w.label.replace('Day ', 'D').replace(' · night', ' ☾')}</button>`).join('');
document.getElementById('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; const k = +b.dataset.k; state.on.has(k) ? state.on.delete(k) : state.on.add(k); if (!state.on.size) state.on.add(k); render(); });
document.getElementById('thr').addEventListener('input', e => { state.thr = +e.target.value; document.getElementById('thrV').textContent = state.thr.toFixed(1) + ' m'; render(); });
render();
</script>
</body>
