  document.addEventListener('pointerdown', e => { if (cur && !el.contains(e.target)) S.clicks[cur] = (S.clicks[cur] || 0) + 1; }, true);
  function placeRing(sel, text) {

    if (!t) { ring.hidden = true; call.hidden = true; return; }
    const r = t.getBoundingClientRect(), p = 5; ring.hidden = false; Object.assign(ring.style, { left: r.left - p + 'px', top: r.top - p + 'px', width: r.width + 2 * p + 'px', height: r.height + 2 * p + 'px' });
    call.hidden = false; if (call.textContent !== text) call.textContent = text; call.style.maxWidth = Math.min(260, innerWidth - 32) + 'px';
    const cr = call.getBoundingClientRect(), right = !phoneW() && !el.classList.contains('min') ? 400 : 0; let x = r.left + r.width / 2 - cr.width / 2, y = r.bottom + 12;
    if (y + cr.height > innerHeight - 8) y = r.top - cr.height - 12;
    x = Math.max(8, Math.min(x, innerWidth - right - cr.width - 8)); call.style.left = x + 'px'; call.style.top = Math.max(8, y) + 'px'; }
  const clearRing = () => { ring.hidden = true; call.hidden = true; };
  const sit = () => S.step >= 1 && S.step <= 6 ? SIT[S.step - 1] : null;
  const guideAt = () => { const s = sit(); return s ? (S.g[s.k] || 0) : -1; };
  const guideDone = () => { const s = sit(); return !s || guideAt() >= s.guide.length; };
  function summary() {
    const A = S.a, L = ['PEDESTRIAN MAP REVIEW', `Consent: ${A.consent ? 'Yes' : 'Not given'}`, `Role: ${A.role || '-'} · Years in practice: ${A.years || '-'}`, `Name: ${A.name || '-'} · Name in report: ${A.nameok || 'No, keep me anonymous'}`, '',
      'BEFORE SEEING THE MAP', `Expected share meeting BMC 1.5 m: ${A.expect || '-'}`, `Expected main cause of blocking: ${A.expectBlock || '-'}`,
      `Familiarisation: ${FAM.filter((_, i) => S.fam[i]).length} of ${FAM.length} tried · guide steps skipped: ${S.gSkipped || 0}`, '', 'SITUATIONS (answer found · ease 1-7 · time · map clicks · answer)'];
    SIT.forEach(s => L.push(`${s.k}. ${s.t}: ${A['done' + s.k] || '-'} · ease ${A['seq' + s.k] || '-'} · ${S.t[s.k] != null ? S.t[s.k] + ' s' : '-'} · ${S.clicks[s.k] || 0} clicks · ${(A['note' + s.k] || '-').replace(/\s+/g, ' ')}`));
    L.push('', 'STATEMENTS (1-5)'); STMTS.forEach((q, i) => L.push(`${i + 1}. ${A['st' + i] || '-'}  ${q}`));
    L.push('', 'UMUX-LITE (1-7): ' + UMUX.map((q, i) => `${A['ux' + i] || '-'} ${q}`).join(' | ')); const sc = umux(); L.push('UMUX-Lite score (0-100): ' + (sc == null ? 'incomplete' : sc));
    L.push('', 'IN PRACTICE'); OPEN.forEach(([k, q]) => L.push(`${q} ${(A['open' + k] || '-').replace(/\s+/g, ' ')}`));

  function canNext() { const s = S.step, A = S.a; if (s === 0) return FAM.filter((_, i) => S.fam[i]).length >= 2 || !!S.famSkip;
    if (s <= 6) { const x = SIT[s - 1]; return guideDone() && !!A['done' + x.k] && !!A['seq' + x.k]; } if (s === 7) return STMTS.every((_, i) => A['st' + i]); if (s === 8) return UMUX.every((_, i) => A['ux' + i]); return true; }
  function render() {
    const s = S.step; el.querySelector('.rv-bar i').style.width = (s / (N - 1) * 100) + '%';
    el.querySelector('.rv-step').textContent = s === 0 ? 'Get familiar' : s <= 6 ? `Situation ${s} of 6` : s === 7 ? 'Your judgement' : s === 8 ? 'Ease of use' : s === 9 ? 'In your practice' : 'Send';
    let h = '';
    if (s === 0) {
      h = `<h3>Get familiar</h3><p>Two minutes. Try each, in any order.</p>
      <ul class="rv-guide rv-fam">${FAM.map(([t], i) => `<li class="${S.fam[i] ? 'ok' : ''}"><span>${t}</span><button class="rv-show${famShow === i ? ' on' : ''}" data-rv="show" data-i="${i}" type="button" aria-label="Show where: ${t}" title="Show where">${EYE}</button></li>`).join('')}</ul>
      ${S.famSkip ? '' : '<button class="rv-skip" data-rv="famskip" type="button">Continue without these</button>'}`;
    } else if (s <= 6) {
      const x = SIT[s - 1], gi = guideAt(), done = guideDone();
      h = `<div class="rv-task"><span class="k">Situation ${x.k}</span><b>${x.t}</b><p class="who">${x.who}</p></div>
      <div class="rv-q first"><span class="rv-lbl">${done ? 'Done.' : 'On the map, click the highlight:'}</span><ol class="rv-guide">${x.guide.map(([, t], i) => `<li class="${i < gi ? 'ok' : i === gi ? 'now' : ''}">${t}</li>`).join('')}</ol>${done ? '' : '<button class="rv-skip" data-rv="gskip" type="button">Skip this step</button>'}</div>`;
      if (done) h += `<div class="rv-q"><b>${x.q}</b><p class="rv-note">Explore as needed. <span class="rv-timer">0:00</span></p></div>
      ${ta('note' + x.k, x.prompt)}
      <div class="rv-q"><span class="rv-lbl">${x.choiceQ || 'Answer found on the map?'}</span>${chips('done' + x.k, x.choice || DONE)}</div>
      <div class="rv-q"><span class="rv-lbl">Ease</span>${scale('seq' + x.k, 7, '1 very hard', '7 very easy')}</div>`;
    } else if (s === 7) {
      h = `<h3>Your judgement</h3><p class="rv-note">1 strongly disagree · 5 strongly agree</p>` + STMTS.map((q, i) => `<div class="rv-q${i ? '' : ' first'}"><span>${i + 1}. ${q}</span>${scale('st' + i, 5, 'Disagree', 'Agree')}</div>`).join('');
    } else if (s === 8) {
      h = `<h3>Ease of use</h3><p class="rv-note">1 strongly disagree · 7 strongly agree</p>` + UMUX.map((q, i) => `<div class="rv-q${i ? '' : ' first'}"><span>${q}</span>${scale('ux' + i, 7, 'Disagree', 'Agree')}</div>`).join('');
    } else if (s === 9) {
      h = `<h3>In your practice</h3><p class="rv-note">You expected ${esc(S.a.expect || '-')} to meet 1.5 m, and ${esc((S.a.expectBlock || '-').toLowerCase())} as the main obstruction.</p>` + OPEN.map(([k, q]) => ta('open' + k, q)).join('');
    } else {
      h = `<h3>${S.sent ? 'Sent. Thank you.' : 'Send your answers'}</h3><p>${S.sent ? 'Received. You can close this page.' : 'Answers go to Kanak by email.'}</p><div class="rv-st" role="status"></div>
      ${S.sent ? '<button class="rv-b g" data-rv="restart" type="button">Start a new review</button>' : ''}<details><summary class="rv-note">See or copy your answers</summary><textarea class="rv-out" readonly>${esc(summary())}</textarea></details>`;
    }
    const keep = bd.scrollTop; bd.innerHTML = h; bd.scrollTop = s === lastStep ? keep : 0; lastStep = s;
    const back = s > 0 ? '<button class="rv-b g" data-rv="back" type="button">Back</button>' : '';
    ft.innerHTML = back + '<span class="rv-sp"></span>' + (s < N - 1 ? `<button class="rv-b p" data-rv="next" type="button"${canNext() ? '' : ' disabled'}>Next</button>` : `<button class="rv-b p" data-rv="send" type="button"${S.sent ? ' disabled' : ''}>${S.sent ? 'Sent' : 'Send'}</button>`);
    if (s >= 1 && s <= 6) startTimer(SIT[s - 1].k); else stopTimer(); }
  let lastStep = -1, lastGi = -1;
  const refreshNext = () => { const b = ft.querySelector('[data-rv="next"]'); if (b) b.disabled = !canNext(); };
  function enterStep(n) { S.step = n; save(); clearRing(); const x = sit();
    if (x && !(S.g[x.k] >= x.guide.length)) { S.g[x.k] = 0; save(); try { x.prep(); } catch (e) {} const pre = x.guide[0][3]; if (pre) setTimeout(pre, 650); }
    else if (n === 0) reset();
    lastGi = guideAt(); if (phoneW() && !(x && !guideDone())) { S.userHid = false; setOpen(true); } render(); setTimeout(applyLayers, 700); }
  function tick() {
    if (S.phase === 'tour' || S.phase === 'panel') { try { if (!stripOff) { stripOff = true; draw(); } } catch (e) {} }
    if (S.phase !== 'panel') return;
    if (state.mode !== lastMode || state.night !== lastNight) applyLayers();
    if (S.step === 0) { let ch = false; FAM.forEach(([, f], i) => { try { if (!S.fam[i] && f()) { S.fam[i] = true; ch = true; } } catch (e) {} }); if (ch) { if (famShow != null && S.fam[famShow]) { famShow = null; if (phoneW()) { S.userHid = false; setOpen(true); } } save(); render(); } if (famShow != null && !S.fam[famShow]) placeRing(FAM[famShow][2], FAM[famShow][3]); else clearRing(); }
    const x = sit();
    if (x) { let gi = guideAt();
      while (gi < x.guide.length) { let ok = false; try { ok = x.guide[gi][2](); } catch (e) {} if (!ok) break; gi++; S.g[x.k] = gi; save(); const pre = x.guide[gi] && x.guide[gi][3]; if (pre) setTimeout(pre, 300); }
      if (gi !== lastGi) { lastGi = gi; render(); if (gi >= x.guide.length && phoneW()) { S.userHid = false; setOpen(true); } }
      if (gi < x.guide.length) { if (phoneW() && !el.classList.contains('min')) setOpen(false); placeRing(x.guide[gi][0], x.guide[gi][1]); } else clearRing(); }
    const tm = el.querySelector('.rv-timer'); if (tm && cur && t0) { const v = Math.round((S.t[cur] || 0) + (Date.now() - t0) / 1000); tm.textContent = Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0'); } }
  setInterval(tick, 350);
  const bdSet = e => { const t = e.target; if (t.dataset.k) S.a[t.dataset.k] = t.value; if (t.type === 'radio') S.a[t.name] = t.value; save(); refreshNext(); };
  bd.addEventListener('input', bdSet); bd.addEventListener('change', bdSet);
  el.addEventListener('click', async e => { const b = e.target.closest('[data-rv]'); if (!b) return; const a = b.dataset.rv;
    if (a === 'min') { S.userHid = true; setOpen(false); return; }
    if (a === 'show') { const i = +b.dataset.i; famShow = famShow === i ? null : i; if (famShow != null && phoneW()) { S.userHid = true; setOpen(false); } render(); return; }
    if (a === 'restart') { try { localStorage.removeItem(KEY); localStorage.removeItem(RKEY); localStorage.removeItem('pedmap-plan'); } catch (e) {} location.reload(); return; }
    if (a === 'famskip') { S.famSkip = true; save(); render(); return; }
    if (a === 'gskip') { const x = sit(); S.g[x.k] = (S.g[x.k] || 0) + 1; S.gSkipped = (S.gSkipped || 0) + 1; save(); const pre = x.guide[S.g[x.k]] && x.guide[S.g[x.k]][3]; if (pre) pre(); return; }
    if (a === 'back') { enterStep(Math.max(0, S.step - 1)); return; }
    if (a === 'next') { enterStep(Math.min(N - 1, S.step + 1)); return; }
    if (a === 'send') { const st = bd.querySelector('.rv-st'); b.disabled = true; st.classList.remove('rv-err'); st.textContent = 'Sending…';
      const body = { _subject: `Pedestrian map review · ${S.a.role || 'reviewer'}${S.a.name ? ' · ' + S.a.name : ''}`, _template: 'box', _captcha: 'false', role: S.a.role || '', years: S.a.years || '', name: S.a.name || '', answers: summary(), data: JSON.stringify({ a: S.a, t: S.t, clicks: S.clicks, fam: S.fam, guideSkips: S.gSkipped || 0, umux: umux() }) };
      try { const r = await fetch(SEND_TO, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({}));
        if (r.ok && String(j.success) === 'true') { S.sent = true; save(); render(); } else throw new Error(j.message || ('server answered ' + r.status)); }
      catch (err) { const m = String(err && err.message || ''); st.classList.add('rv-err'); st.textContent = (/activat/i.test(m) ? 'Not delivered yet: the form is waiting for Kanak to activate it. ' : 'Could not send' + (m ? ' (' + m.slice(0, 160) + ')' : '') + '. ') + 'Open “See or copy your answers”, copy them, and email them to Kanak.'; b.disabled = false; } } });

  wl.hidden = false; renderWelcome();
