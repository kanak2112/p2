<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Old Nagardas Road on foot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* A street map for people on foot: the street fills the screen, a sheet on the left (bottom on phones) holds search, places, directions and reports */
:root{
  --ground:#E4E7E1; --paper:#F3F4F0; --card:#FFFFFF; --ink:#141414; --ink2:#4E534C; --ink3:#868C83; --hair:#D5DAD1;
  --bldg:#D3D7CE; --bldg2:#C3C8BE; --road:#B4B9B1; --kerb:#8D928A; --taken:#3A3D39; --walk:#FAFBF7;
  --mus:#966C00; --yel:#F2B800; --red:#C2402D; --amb:#D6921B; --teal:#12867E; --navy:#1E2A45;
  --fix:#3657C9; --veh:#D9622B; --ppl:#D7A511; --tree:#5E7A57;
  --serif:Roboto,Arial,sans-serif; --sans:Roboto,Arial,sans-serif; --mono:"Roboto Mono",ui-monospace,monospace; --pri:#1A73E8; --pri2:#1967D2; --pribg:#E8F0FE; --g1:#202124; --g2:#5F6368; --g3:#70757A; --gl:#DADCE0;
  --shadow:0 1px 2px rgba(0,0,0,.12),0 6px 18px -6px rgba(20,30,20,.28);
  --sheetW:408px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--ground)}
#map.drag{cursor:grabbing}#map.pick{cursor:crosshair}
#map text{font-family:var(--sans)}
/* search bar */
.sbar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;width:calc(var(--sheetW) - 32px);height:48px;background:var(--card);border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;padding:0 6px;z-index:20}
.sbar input{flex:1;min-width:0;border:0;background:none;height:100%;padding:0 6px;font-size:15px;outline:none}
.ib{border:0;background:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:none}
.ib:hover{background:var(--paper)}
.sbar .sep{width:1px;height:24px;background:var(--hair);margin:0 2px}
.sbar .dir{color:var(--pri)}
.sugg{position:absolute;left:0;right:0;top:54px;background:var(--card);box-shadow:var(--shadow);border-radius:12px;overflow:hidden;padding:6px 0}
.sugg button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:9px 16px;text-align:left}
.sugg button:hover,.sugg button.on{background:var(--paper)}
.sugg .t{display:grid;line-height:1.3}.sugg small{font-size:12px;color:var(--ink3)}
.sugg .pin{width:30px;height:30px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--ink2);flex:none}
/* chips */
.chips{position:absolute;left:calc(var(--sheetW) + 4px);right:16px;top:16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;z-index:6;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;gap:7px;align-items:center;height:36px;padding:0 14px 0 11px;border:0;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font:500 13px var(--sans);white-space:nowrap}
.chip svg.i{width:17px;height:17px}
.chip[aria-pressed=true]{background:#E8F0FE;color:#1967D2;box-shadow:inset 0 0 0 1px #D2E3FC,var(--shadow)}
/* sheet */
.sheet{position:absolute;left:0;top:0;bottom:0;width:var(--sheetW);background:var(--card);box-shadow:0 0 18px rgba(0,0,0,.18);z-index:10;display:flex;flex-direction:column;transition:transform .25s ease}
.sheet.col{transform:translateX(-100%)}
.handle{display:none}
.sc{overflow-y:auto;flex:1;padding-top:72px;overscroll-behavior:contain}
.tab{position:absolute;left:100%;top:50%;transform:translateY(-50%);width:22px;height:48px;border:0;border-radius:0 8px 8px 0;background:var(--card);box-shadow:4px 0 8px -4px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--ink3)}
.sec{padding:16px 22px;border-bottom:1px solid var(--hair)}
.sec:last-child{border-bottom:0}
.lab{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.h1{font:400 26px/1.15 var(--serif);margin:0}
.sub{color:var(--ink2);font-size:13px;margin-top:3px}
.acts{display:flex;justify-content:space-between;gap:4px;padding:14px 16px;border-bottom:1px solid var(--hair)}
.act{border:0;background:none;display:grid;justify-items:center;gap:6px;font:500 12px var(--sans);color:var(--pri);padding:0;min-width:58px}
.act span.c{width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);display:grid;place-items:center}
.act.pri span.c{background:var(--pri);border-color:var(--pri);color:#fff}
.act:hover span.c{background:#E8F0FE}.act.pri:hover span.c{background:#1765CC}
.row{display:flex;gap:14px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:10px 22px}
button.row:hover{background:var(--paper)}
.row .ic{width:32px;height:32px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--ink2);flex:none}
.row .t{flex:1;min-width:0}.row .t b{font-weight:500;display:block}.row .t small{color:var(--ink3);font-size:12.5px}
.row .v{font:500 14px var(--mono);white-space:nowrap}
.list{padding:6px 0}
.list .lab{padding:6px 22px 2px}
.strip{display:grid;grid-template-columns:repeat(22,1fr);gap:2px;margin-top:10px}
.strip button{height:26px;border:0;border-radius:2px;padding:0}
.strip button.on{outline:2px solid var(--ink);outline-offset:1px}
.sx{display:flex;justify-content:space-between;font:400 10.5px var(--mono);color:var(--ink3);margin-top:4px}
.score{display:flex;gap:16px;align-items:center;margin-top:14px}
.score svg{width:64px;height:64px;flex:none}
.score p{margin:0;font-size:13px;color:var(--ink2)}
.score p b{color:var(--ink);font-weight:500}
.note{font:400 11.5px/1.6 var(--mono);color:var(--ink3);margin:0}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:18px;height:36px;padding:0 16px;font:500 13px var(--sans);display:inline-flex;gap:7px;align-items:center}
.btn.g{background:var(--card);color:var(--pri);border-color:var(--hair)}
.btn:hover{filter:brightness(.95)}
.btn[disabled]{opacity:.45;cursor:default}
/* place */
.ph{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;height:44px}
.ph .grow{flex:1;font:400 11.5px var(--mono);color:var(--ink3);letter-spacing:.06em}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.hero .im{position:relative;aspect-ratio:240/300;overflow:hidden;background:var(--paper);border:0;padding:0}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .cap{position:absolute;left:8px;bottom:8px;background:rgba(20,20,20,.72);color:#fff;font:500 10.5px var(--mono);letter-spacing:.05em;padding:4px 7px;border-radius:3px}
.wbig{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.wbig b{font:500 44px/1 var(--mono);letter-spacing:-.03em}
.wbig span{font:400 12px var(--mono);color:var(--ink3)}
.verdict{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font:500 12px var(--sans);padding:4px 10px;border-radius:12px}
.v-bad{background:#F6E0DB;color:#A3321F}.v-warn{background:#F7EAD0;color:#86560A}.v-ok{background:#D5ECE8;color:#0E6B64}.v-na{background:var(--paper);color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr}
.stat{padding:12px 0 10px;border-bottom:1px solid var(--hair)}
.stat:nth-child(odd){padding-right:12px;border-right:1px solid var(--hair)}.stat:nth-child(even){padding-left:14px}
.stat b{display:block;font:500 20px var(--mono)}.stat span{font-size:12px;color:var(--ink3)}
.bars{display:grid;gap:7px;margin-top:10px}
.bar{display:grid;grid-template-columns:104px 1fr 38px;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.bar .tr{height:6px;background:var(--paper);border-radius:3px;overflow:hidden}.bar .tr i{display:block;height:100%}
.bar em{font:400 11.5px var(--mono);font-style:normal;text-align:right}
.who{margin-top:4px;padding:12px 14px;background:var(--paper);border-radius:8px;font-size:13px;color:var(--ink2)}
.who b{color:var(--ink);font-weight:500}
/* directions */
.dh{padding:12px 16px 14px 8px;background:var(--card);border-bottom:1px solid var(--hair)}
.dmodes{display:flex;gap:6px;padding:0 0 12px 40px}
.dm{border:0;background:none;border-radius:16px;height:32px;padding:0 12px;display:flex;gap:6px;align-items:center;color:var(--ink2);font:500 12.5px var(--sans)}
.dm[aria-pressed=true]{background:#E8F0FE;color:#1967D2}
.ft{display:grid;grid-template-columns:32px 1fr 36px;gap:6px;align-items:center}
.ft .dots{display:grid;justify-items:center;gap:5px;grid-row:span 2}
.ft .dots i{width:3px;height:3px;border-radius:50%;background:var(--ink3)}
.ft .dots .a{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink2);background:#fff}
.ft .dots .b{color:var(--red)}
.ft select{width:100%;height:38px;border:1px solid var(--hair);border-radius:6px;background:var(--card);padding:0 10px;font-size:14px}
.ft .swap{grid-row:span 2}
.dsum{padding:16px 22px;border-bottom:1px solid var(--hair)}
.dsum .t{display:flex;align-items:baseline;gap:10px}
.dsum .t b{font:500 24px var(--sans);color:var(--teal)}
.dsum .t span{color:var(--ink2)}
.alert{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:8px;font-size:13px}
.alert.r{background:#F6E0DB;color:#7D2617}.alert.a{background:#F7EAD0;color:#6E4708}.alert.n{background:var(--paper);color:var(--ink2)}
.alert svg.i{width:18px;height:18px;margin-top:1px}
.steps{padding:6px 0 10px}
.step{display:grid;grid-template-columns:40px 1fr auto;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 22px 10px 14px;align-items:start}
.step:hover{background:var(--paper)}
.step .si{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.step b{font-weight:500;display:block}.step small{color:var(--ink3);font-size:12.5px}
.step em{font:400 12px var(--mono);font-style:normal;color:var(--ink3);padding-top:4px}
.slider{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:13px;color:var(--ink2)}
.slider input{flex:1;accent-color:var(--pri)}
.slider b{font:500 14px var(--mono);color:var(--ink)}
/* report */
.kinds{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.kind{border:1px solid var(--hair);background:var(--card);border-radius:16px;height:32px;padding:0 12px;font-size:13px}
.kind[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
textarea{width:100%;border:1px solid var(--hair);border-radius:8px;padding:10px 12px;min-height:80px;resize:vertical;font-size:14px;margin-top:10px}
input[type=range]{accent-color:var(--pri)}
.rep{display:flex;gap:12px;padding:10px 22px;width:100%;border:0;background:none;text-align:left}
button.rep:hover{background:var(--paper)}
.rep .d{width:12px;height:12px;transform:rotate(45deg);background:var(--ink);margin:5px 6px 0;flex:none;border-radius:2px}
.rep b{font-weight:500}.rep small{display:block;color:var(--ink3);font-size:12px}
.rep p{margin:2px 0 0;font-size:13px;color:var(--ink2);word-break:break-word}
/* map controls */
.tools{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;justify-items:end;z-index:6}
.tg{background:var(--card);border-radius:8px;box-shadow:var(--shadow);display:grid;overflow:hidden}
.tg button{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;color:var(--ink2);font:500 12px var(--mono)}
.tg button+button{border-top:1px solid var(--hair)}
.tg button:hover{background:var(--paper)}
.tg button[aria-pressed=true]{color:var(--pri);background:#E8F0FE}
.peg{background:var(--card);border-radius:8px;box-shadow:var(--shadow);border:0;width:40px;height:40px;display:grid;place-items:center;color:var(--mus)}
.scale{display:flex;align-items:center;gap:8px;font:400 11px var(--mono);color:var(--ink2);background:rgba(255,255,255,.8);padding:3px 8px;border-radius:3px}
.scale .sb{height:6px;border:1.5px solid var(--ink2);border-top:0}
.lay{position:absolute;left:calc(var(--sheetW) + 16px);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:6}
.layb{width:64px;height:64px;border-radius:8px;border:2px solid #fff;box-shadow:var(--shadow);background:linear-gradient(135deg,var(--bldg) 0 40%,var(--taken) 40% 52%,var(--walk) 52% 66%,var(--road) 66%);display:flex;align-items:flex-end;justify-content:center;padding:0 0 4px;color:#fff;font:500 11px var(--sans);text-shadow:0 1px 2px rgba(0,0,0,.7)}
.laypop{position:absolute;left:0;bottom:74px;width:290px;background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:12px;max-height:70vh;overflow:auto}
.laypop label{display:flex;gap:10px;align-items:center;font-size:13px;padding:2px 0}
.laypop input[type=checkbox]{accent-color:var(--pri);width:15px;height:15px}
.leg{display:grid;gap:5px;font-size:12.5px;color:var(--ink2)}
.leg div{display:flex;gap:9px;align-items:center}
.leg i{width:18px;height:10px;border-radius:2px;flex:none}
select.walk{width:100%;border:1px solid var(--hair);border-radius:6px;padding:7px 8px;font-size:13px;background:var(--card)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font:400 12px var(--mono);padding:7px 10px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .1s;z-index:30}
.tip b{color:var(--yel);font-weight:500}
.toast{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#262826;color:#fff;font-size:13px;padding:11px 16px;border-radius:6px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
/* layers: map type + map details */
.layb{position:relative;overflow:hidden;width:72px;height:72px;border-radius:10px;border:2px solid #fff;box-shadow:var(--shadow);background:var(--card);padding:0;display:block}
.layb .th svg{position:absolute;inset:0;width:100%;height:100%}
.layb .tl{position:absolute;left:0;right:0;bottom:0;display:flex;gap:3px;justify-content:center;align-items:center;padding:3px 0 4px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font:500 11px var(--sans)}
.layb .tl svg.i{width:13px;height:13px}
.layb .li{display:none}
.laypop{bottom:84px;width:372px;gap:14px;padding:16px 18px 18px}
.lp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:-4px}.lp-h b{font:500 15px var(--sans)}
.types{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ty{border:0;background:none;padding:0;display:grid;gap:5px;justify-items:center;font-size:11.5px;color:var(--ink2)}
.ty svg{width:100%;aspect-ratio:3/2;border-radius:8px;outline:2px solid transparent;outline-offset:1px;display:block}
.ty[aria-pressed=true]{color:var(--pri);font-weight:600}.ty[aria-pressed=true] svg{outline-color:var(--pri)}
.dets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px}
.dt{border:0;background:none;padding:0;display:grid;justify-items:center;gap:5px;font-size:11px;color:var(--ink2);text-align:center;line-height:1.2}
.dt .c{width:44px;height:44px;border-radius:10px;border:1px solid var(--hair);display:grid;place-items:center}
.dt[aria-pressed=true]{color:var(--pri);font-weight:500}.dt[aria-pressed=true] .c{border:2px solid var(--pri);background:#E8F0FE}
.lay.open{z-index:50}
.laybg{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:44}
.mkey{position:absolute;left:calc(var(--sheetW) + 100px);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:5;background:rgba(255,255,255,.94);box-shadow:var(--shadow);border-radius:8px;padding:8px 12px;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--ink2);max-width:calc(100% - var(--sheetW) - 220px);flex-wrap:wrap}
.mkey b{font:500 12px var(--sans);color:var(--ink)}.mkey .ex{color:var(--g3);font-size:11.5px}
.mkey div{display:flex;gap:6px;align-items:center}.mkey i{width:16px;height:9px;border-radius:2px;flex:none}
.colmode .mkey{left:100px}
.mtype{display:flex;gap:12px;align-items:center;width:100%;margin-top:12px;border:1px solid var(--hair);border-radius:10px;background:var(--card);padding:8px 10px;text-align:left}
.mtype:hover{background:var(--paper)}
.mtype .mt svg{width:66px;height:44px;border-radius:6px;display:block}
.mtype b{display:block;font-weight:500}.mtype small{display:block;color:var(--ink2);font-size:12px;line-height:1.35}
.peg[aria-pressed=true]{background:#E8F0FE;color:#1967D2}
#lsB{color:var(--ink2)}
/* Google-style type and surfaces */
body{color:var(--g1)}
.lab{font:500 14px var(--sans);letter-spacing:0;text-transform:none;color:var(--g1)}
.note{font:400 12px/1.5 var(--sans);color:var(--g3)}
.h1{font:400 22px/1.27 var(--sans);color:var(--g1)}
.sub{color:var(--g2);font-size:14px}
.row .t b{font-weight:400;font-size:15px}.row .t small{color:var(--g2);font-size:13px}
.row .v,.stat b,.wbig b{font-family:var(--sans)}
.row .v{font-weight:500;font-size:14px;color:var(--g1)}
.wbig b{font-weight:400;font-size:40px;letter-spacing:0}
.wbig span,.ph .grow,.sx,.bar em{font-family:var(--sans);letter-spacing:0;color:var(--g2)}
.ph .grow{font-size:13px}
.act{font:500 12px var(--sans);color:var(--pri)}
.act span.c{border-color:var(--gl)}
.btn{border-radius:18px;font:500 14px var(--sans)}
.btn.g{border-color:var(--gl)}
.chip{font:500 14px var(--sans);color:var(--g1);height:32px;border-radius:8px;box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15)}
.chip[aria-pressed=true]{box-shadow:inset 0 0 0 1px #D2E3FC,0 1px 2px rgba(60,64,67,.3)}
.sbar{border-radius:24px;box-shadow:0 2px 4px rgba(0,0,0,.2),0 -1px 0 rgba(0,0,0,.02)}
.sbar input{font-size:15px}
.sec{border-color:var(--gl)}.acts{border-color:var(--gl)}
/* directions, laid out like a maps app */
.dh{position:relative;padding:8px 12px 14px 8px;border-bottom:8px solid #F1F3F4}
.mtabs{display:flex;align-items:flex-end;gap:2px;padding:4px 0 10px 28px}
.mtab{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:6px 10px 4px;border-radius:16px 16px 0 0;color:var(--g2);font:500 12px var(--sans);min-width:64px;position:relative}
.mtab .ico{width:44px;height:30px;border-radius:15px;display:grid;place-items:center}
.mtab[aria-pressed=true]{color:var(--g1)}.mtab[aria-pressed=true] .ico{background:#C2E7FF;color:#001D35}
.mtabs .x{margin-left:auto;align-self:center}
.ft{grid-template-columns:36px 1fr 40px;row-gap:10px}
.fi input{width:100%;height:42px;border:1px solid var(--gl);border-radius:6px;padding:0 12px;font-size:15px;color:var(--g1);background:#fff}
.fi input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.ft .dots .a{border-color:var(--g1)}
.dsugg{top:auto;left:44px;right:48px;z-index:5}
.rcard{display:grid;grid-template-columns:36px 1fr auto;gap:12px;padding:16px 22px 14px;border-bottom:1px solid var(--gl)}
.rcard .ri{color:var(--g1);padding-top:2px}
.rcard b{font:400 16px/1.35 var(--sans);display:block}.rcard small{display:block;color:var(--g2);font-size:13px;margin-top:2px}

      <div class="ph2">${p ? `<img src="${src}" alt="Walk photo, ${i * 10} to ${i * 10 + 10} m">${v.trace && !v.night && p.path && p.path.length > 5 ? `<svg viewBox="0 0 1 1" preserveAspectRatio="none"><polygon points="${p.path.map(q => q.join(',')).join(' ')}" fill="rgba(242,184,0,.3)" stroke="#F2B800" stroke-width=".006"/></svg>` : ''}` : ''}</div>
      <button class="arw" data-v="next" aria-label="Next stretch" ${i === 21 ? 'style="visibility:hidden"' : ''}>${I.chevR}</button>
      <div class="side"><b>${(v.night ? s.ng : s.g) == null ? '—' : (v.night ? s.ng : s.g).toFixed(1) + ' m'}</b><span>${(v.night ? s.ng : s.g) == null ? 'width not measured here' : 'clear to walk, median of ' + (v.night ? 'night' : 'daytime') + ' walks'}</span><span style="margin-top:10px">Blocked on ${s.b} of ${s.n} walks · ${s.sw} swerved · ${s.hk} horns</span><button class="btn g" data-v="map" style="margin-top:14px;justify-self:start">${I.pin}Open on the map</button></div></div>
    <div class="svs">${Array.from({ length: NB }, (_, k) => { const q = svPhoto(k, v.night, v.dir); return `<button data-v="go" data-k="${k}" class="${k === i ? 'on' : ''}" aria-label="${k * 10} m">${q ? `<img src="../lab/ph/${q.id}.jpg" alt="" loading="lazy">` : ''}<span>${k * 10}</span></button>`; }).join('')}</div>`;
  const on = svEl.querySelector('.svs .on'), st = svEl.querySelector('.svs'); if (on && st) st.scrollLeft = on.offsetLeft - st.clientWidth / 2 + on.offsetWidth / 2; }
svEl.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; const v = state.sv, k = b.dataset.v;
  if (k === 'close') return closeSV(); if (k === 'map') { const i = v.i; state.sv = null; svEl.hidden = true; return state.nav ? null : openPlace(i, true); }
  if (k === 'day') v.night = false; if (k === 'night') v.night = true; if (k === 'trace') v.trace = !v.trace;
  if (k === 'prev') v.i = Math.max(0, v.i - 1); if (k === 'next') v.i = Math.min(21, v.i + 1); if (k === 'go') v.i = +b.dataset.k;
  renderSV(); syncHash(); });

/* ---------- reports (shared through the page's database when available) ---------- */
let db = null, userNS = null, canWrite = null, REPORTS = [];
const LKEY = 'pedmap-reports';
const valid = r => r && typeof r.m === 'number' && r.m >= 0 && r.m <= L && KINDS[r.kind] && typeof r.at === 'number' && (r.note == null || (typeof r.note === 'string' && r.note.length <= 200));
function localReps() { try { return (JSON.parse(localStorage.getItem(LKEY) || '[]') || []).filter(valid); } catch (e) { return []; } }
function refreshReports() { REPORTS.sort((a, b) => b.at - a.at); if (['home', 'place'].includes(state.view)) setView(state.view, { keepScroll: true }); else draw(); }
(async () => { try { if (window.claude && window.claude.use) { db = await window.claude.use('db').catch(() => null); userNS = await window.claude.use('user').catch(() => null); } } catch (e) { db = null; }
  if (db) { try { db.collection('reports').orderBy('at', 'desc').limit(300).onSnapshot(snap => { REPORTS = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(valid); refreshReports(); }, () => { toast('Reports could not be loaded.'); }); } catch (e) { db = null; }
    if (userNS) { try { canWrite = await userNS.can('data.write'); } catch (e) { canWrite = null; } if (state.view === 'report') setView('report', { keepScroll: true }); } }
  if (!db) { REPORTS = localReps(); refreshReports(); } })();
async function sendReport() { const m = state.repM ?? (state.sel != null ? state.sel * 10 + 5 : 85), note = ($('repN').value || '').trim().slice(0, 200), btn = sc.querySelector('[data-act=send]'), msg = $('repMsg');
  const r = { m: Math.round(m), kind: state.kind, note, at: Date.now() }; btn.disabled = true; msg.textContent = 'Sending…';
  try { if (db) { let by = null; try { by = userNS ? await userNS.id() : null; } catch (e) {} await db.collection('reports').add({ ...r, by }); }
    else { const all = localReps(); all.unshift(r); try { localStorage.setItem(LKEY, JSON.stringify(all.slice(0, 300))); } catch (e) {} REPORTS = all; }
    toast('Report added. Thank you.'); state.sel = Math.min(21, Math.floor(r.m / 10)); openPlace(state.sel, true);
  } catch (e) { btn.disabled = false; msg.textContent = e && e.code === 'permission_denied' ? 'This map does not accept reports from you.' : 'Could not send. Try again.'; } }

/* ---------- share, files ---------- */
function hashNow() { if (state.sv) return `sv-${state.sv.i * 10}${state.sv.night ? '-night' : ''}`; if (state.nav || state.view === 'dirs') return `route-${state.from}-${state.to}-${state.prof}`; if (state.view === 'place') return `s-${state.sel * 10}`; if (state.view === 'plan') return 'plan'; return state.view === 'home' ? '' : state.view === 'report' ? 'report' : ''; }
function syncHash() { if (!booted) return; try { history.replaceState(null, '', '#' + hashNow()); } catch (e) {} }
function share() { const h = '#' + (hashNow() || 'home'), what = state.view === 'place' ? `${placeOf(state.sel * 10 + 5)}, ${state.sel * 10}–${state.sel * 10 + 10} m` : state.view === 'dirs' ? `Walking directions, ${nameAt(state.from)} to ${nameAt(state.to)}` : 'Old Nagardas Road on foot';
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="box" role="dialog" aria-label="Share"><b style="font:400 22px var(--serif)">Share</b><div class="sub">${esc(what)}</div><p class="note">Copy this page’s link, then add this to the end to open straight onto this view:</p><input readonly value="${esc(h)}"><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn g" data-x="1">Close</button><button class="btn" data-c="1">${I.copy}Copy</button></div></div>`;
  $('app').appendChild(m); const inp = m.querySelector('input'); inp.select();
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) m.remove(); if (e.target.closest('[data-c]')) { inp.select(); (navigator.clipboard ? navigator.clipboard.writeText(inp.value) : Promise.reject()).then(() => { toast('Copied'); m.remove(); }, () => toast('Press Ctrl+C to copy')); } }); }
function toast(msg) { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); $('app').appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3000); }
async function saveFile(name, data, type) { let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) { try { await dl.save({ filename: name, data }); } catch (e) { if (!e || e.code !== 'declined') toast('Could not save the file.'); } return; }
  if (window.claude) { toast('Saving files is not available in this view.'); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function saveEvidence() { const i = state.sel, s = STATS[i];
  const lines = [['Location', `Old Nagardas Road, Andheri East (K/East ward) · ${i * 10}–${i * 10 + 10} m from R.K. Chouhan Communications`], ['Clear walkway', s.g == null ? 'not measurable here' : `${s.g.toFixed(1)} m (median of ${s.gN} daytime photos) · BMC Universal Footpath Policy minimum 1.5 m`], ['Blocked', `${s.b} of ${s.n} walks`], ['Walkers swerved', `${s.sw} walks`], ['Horns heard', `${s.hk}`], ['Seen on daytime walks', `fixed things ${Math.round(s.sh.fixed * 100)}% · vehicles ${Math.round(s.sh.vehicle * 100)}% · people and stalls ${Math.round(s.sh.people * 100)}%`], ['At night', s.ng == null ? 'width not measured' : `${s.ng.toFixed(1)} m clear`], ['Reports on this map', `${REPORTS.filter(r => Math.floor(r.m / 10) === i).length}`], ['Method', 'Walks recorded in Oct 2026 on one side of the road; widths are camera estimates from walk photos, not tape-measured.']];
  const svgTxt = `<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="0 0 210 148"><rect width="210" height="148" fill="#fff"/><text x="12" y="18" font-family="Georgia" font-size="9">Footpath evidence · ${esc(placeOf(i * 10 + 5))}</text>${lines.map((l, j) => `<text x="12" y="${30 + j * 12.5}" font-family="Arial" font-size="3.4" fill="#777">${esc(l[0].toUpperCase())}</text><text x="12" y="${35 + j * 12.5}" font-family="Arial" font-size="4.2">${esc(l[1])}</text>`).join('')}</svg>`;
  saveFile(`footpath-evidence-${i * 10}-${i * 10 + 10}m.svg`, svgTxt, 'image/svg+xml'); }

/* ---------- keys, hash, start ---------- */
addEventListener('keydown', e => { const tag = e.target.tagName; if (e.key === 'Escape') { if (document.querySelector('.modal')) return document.querySelector('.modal').remove(); if (state.sv) return closeSV(); if (state.nav) return exitNav(); if (state.pick) { state.pick = null; svg.classList.remove('pick'); return; } if (state.view !== 'home' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(tag)) return doAct('home'); }
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || document.querySelector('.modal')) return;
  if (e.key === '/') { e.preventDefault(); q.focus(); return; }
  const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (d && state.sv) { state.sv.i = clamp(state.sv.i + d, 0, 21); renderSV(); syncHash(); return; }
  if (d && state.nav) { stopPlay(); jumpStep(d); return; }
  if (d) { openPlace(state.sel == null ? (d > 0 ? 0 : 21) : state.sel + d, true); return; }
  if (e.key === '+' || e.key === '=') zoomAt(.7, ...mapCentre()); if (e.key === '-') zoomAt(1.4, ...mapCentre()); });
let rsz = 0; addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (phone()) snap(snapNow); if (state.vb) setVB(state.vb, true); }, 100); });
function route(h) { h = (h || '').replace(/^#/, ''); let m;
  if ((m = h.match(/^s-(\d{1,3})$/))) { openPlace(Math.min(21, Math.floor(+m[1] / 10)), true); return true; }
  if ((m = h.match(/^route-(\d{1,3})-(\d{1,3})(?:-(walk|access|night))?$/))) { state.from = clamp(+m[1], 0, L); state.to = clamp(+m[2], 0, L); state.prof = m[3] || 'walk'; openDirs(); return true; }
  if ((m = h.match(/^sv-(\d{1,3})(-night)?$/))) { openSV(Math.min(21, Math.floor(+m[1] / 10)), !!m[2]); return true; }
  if (h === 'street-view') { openSV(8, false); return true; }
  if (h === 'report') { doAct('report'); return true; }
  if (h === 'directions') { openDirs(); return true; }
  if (h === 'plan') { setMode('plan'); return true; }
  return false; }
addEventListener('hashchange', () => { if (location.hash.slice(1) !== hashNow()) route(location.hash); });

state.layers = { ...ALWAYS, ...MODES.walk.L }; state.plan = loadPlan();
renderChips(); renderLayers(); if (phone()) snap('peek');
setView('home'); K = 1; draw(); setVB(fitBox(), true);
const routed = route(location.hash); booted = true; syncHash();
if (!routed) setTimeout(() => { if (state.view === 'home' && !state.sv) fly(fitBox(), 900); }, 400);
document.fonts && document.fonts.ready.then(() => draw());
</script>
</body>
</html>
