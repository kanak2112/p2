<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Old Nagardas Road on foot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: the street fills the screen; a mode panel floats left, the stretch card right, scale and overview along the bottom */
:root{
  --ground:#E4E7E1; --paper:#F3F4F0; --card:#FFFFFF; --ink:#141414; --ink2:#4E534C; --ink3:#868C83; --hair:#C6CCC2;
  --bldg:#D3D7CE; --bldg2:#C3C8BE; --road:#B4B9B1; --kerb:#8D928A; --taken:#3A3D39; --walk:#FAFBF7;
  --mus:#966C00; --yel:#F2B800; --red:#C2402D; --amb:#D6921B; --teal:#12867E; --navy:#1E2A45;
  --fix:#3657C9; --veh:#D9622B; --ppl:#D7A511; --tree:#5E7A57;
  --serif:"Playfair Display",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 12px 32px -14px rgba(20,30,20,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input{font:inherit;color:inherit}
.app{position:relative;height:100%;width:100%}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--ground)}
#map.drag{cursor:grabbing}
#map text{font-family:var(--sans)}
[hidden]{display:none!important}
/* top bar */
.top{position:absolute;left:0;right:0;top:0;display:flex;gap:12px;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{background:var(--card);box-shadow:var(--shadow);border-radius:6px;padding:9px 14px;display:flex;gap:12px;align-items:baseline}
.brand b{font:400 19px var(--serif)}
.brand span{font:400 11px var(--mono);color:var(--ink3);letter-spacing:.06em}
.search{position:relative;flex:0 1 320px}
.search input{width:100%;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:6px;padding:11px 14px;font-size:14px}
.search input:focus{outline:2px solid var(--yel)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);box-shadow:var(--shadow);border-radius:6px;overflow:hidden}
.sugg button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:9px 14px;text-align:left;cursor:pointer}
.sugg button:hover,.sugg button.on{background:var(--paper)}
.sugg small{font:400 11px var(--mono);color:var(--ink3)}
.grow{flex:1}
.links{display:flex;gap:6px}
.links a{background:var(--card);box-shadow:var(--shadow);border-radius:6px;padding:9px 12px;text-decoration:none;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.links a:hover{background:var(--paper)}
/* panel */
.panel{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:70px;bottom:96px;width:320px;background:var(--card);box-shadow:var(--shadow);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;z-index:4}
.panel .ph{padding:16px 18px 10px;border-bottom:1px solid var(--hair)}
.lab{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.mode{border:1px solid var(--hair);background:var(--paper);border-radius:5px;padding:8px 10px;text-align:left;cursor:pointer;display:grid;gap:1px}
.mode b{font:500 13px var(--sans)}
.mode span{font:400 11px var(--sans);color:var(--ink3)}
.mode[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.mode[aria-pressed=true] span{color:#cfd3cb}
.pbody{overflow:auto;padding:14px 18px 18px;display:grid;gap:16px;align-content:start}
.q{font:400 21px/1.2 var(--serif);margin:0;text-wrap:balance}
.sum{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;border:0;background:none;padding:6px 0;border-bottom:1px solid var(--hair);text-align:left;cursor:pointer}
.srow:hover{background:var(--paper)}
.srow .ch{font:400 11px var(--mono);color:var(--ink3)}
.srow .v{font:500 14px var(--mono)}
.srow em{font-style:normal;font-size:12.5px;color:var(--ink2)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.big3 div{background:var(--paper);border-radius:5px;padding:9px 10px}
.big3 b{display:block;font:500 24px var(--mono)}
.big3 span{font:400 11px var(--sans);color:var(--ink2)}
.layers{display:grid;gap:4px}
.layers label{display:flex;gap:10px;align-items:center;cursor:pointer;padding:3px 0;font-size:13px}
.layers input{accent-color:var(--ink);width:15px;height:15px}
.layers i{width:18px;height:10px;border-radius:2px;display:inline-block;margin-left:auto}
.legend{display:grid;gap:5px;font-size:12px;color:var(--ink2)}
.legend div{display:flex;gap:9px;align-items:center}
.legend i{width:18px;height:10px;border-radius:2px;display:inline-block;flex:none}
.slider{display:flex;gap:10px;align-items:center}
.slider input{flex:1;accent-color:var(--ink)}
.slider b{font:500 15px var(--mono)}
select.walk{width:100%;border:1px solid var(--hair);background:var(--paper);border-radius:5px;padding:7px 8px;font-size:12.5px}
.note{font:400 11px var(--mono);color:var(--ink3);line-height:1.6}
/* card */
.card{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:70px;bottom:96px;width:340px;background:var(--card);box-shadow:var(--shadow);border-radius:8px;overflow:auto;z-index:4;padding:18px 20px}
.card .x{display:flex;justify-content:space-between;align-items:center}
.card .ch{font:400 11px var(--mono);letter-spacing:.1em;color:var(--ink3);text-transform:uppercase}
.card .nav{display:flex;gap:4px}
.card .nav button{border:1px solid var(--hair);background:var(--paper);border-radius:4px;width:28px;height:28px;cursor:pointer}
.card h2{font:400 26px/1.15 var(--serif);margin:6px 0 10px}
.wbig{display:flex;align-items:baseline;gap:8px}
.wbig b{font:500 48px/1 var(--mono);letter-spacing:-.03em}
.wbig span{font:400 12px var(--mono);color:var(--ink3)}
.verdict{display:inline-block;margin:10px 0 14px;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:3px}
.v-bad{background:#F4DCD7;color:var(--red)}.v-warn{background:#F5E6C7;color:#8F5E07}.v-ok{background:#D3EAE6;color:var(--teal)}.v-na{background:var(--paper);color:var(--ink2)}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pic{margin:0}.pic .im{position:relative;aspect-ratio:240/427;max-width:100%;border-radius:4px;overflow:hidden;background:var(--paper)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}.pic svg{position:absolute;inset:0;width:100%;height:100%}
.pic figcaption{font:400 10px var(--mono);color:var(--ink3);margin-top:4px;letter-spacing:.04em}
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border-top:1px solid var(--hair)}
.stat{padding:10px 0 8px;border-bottom:1px solid var(--hair)}
.stat:nth-child(odd){padding-right:10px;border-right:1px solid var(--hair)}.stat:nth-child(even){padding-left:12px}
.stat b{display:block;font:500 20px var(--mono)}.stat span{font:400 11px var(--sans);color:var(--ink3)}
.who{margin-top:14px;padding:12px;background:var(--paper);border-radius:5px;font-size:13px;color:var(--ink2)}
.who b{color:var(--ink);font-weight:500}
.bars{display:grid;gap:6px;margin-top:12px}
.bar{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:12px;color:var(--ink2)}
.bar .tr{height:4px;background:var(--paper);border-radius:2px;overflow:hidden}.bar .tr i{display:block;height:100%}
.bar em{font:400 11px var(--mono);font-style:normal;text-align:right}
.acts{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:8px 12px;cursor:pointer;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.btn.ghost{background:none;color:var(--ink)}
/* bottom */
.bottom{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:stretch;z-index:4;pointer-events:none}
.bottom>*{pointer-events:auto}
.ov{flex:1;background:var(--card);box-shadow:var(--shadow);border-radius:8px;padding:8px 12px 6px;min-width:0}
.ov svg{width:100%;height:44px;display:block;cursor:pointer}
.ctl{background:var(--card);box-shadow:var(--shadow);border-radius:8px;display:flex;align-items:center;gap:2px;padding:4px}
.ctl button{border:0;background:none;width:38px;height:38px;border-radius:5px;cursor:pointer;font:500 15px var(--mono)}
.ctl button:hover{background:var(--paper)}
.ctl button[aria-pressed=true]{background:var(--ink);color:#fff}
.scale{background:var(--card);box-shadow:var(--shadow);border-radius:8px;padding:10px 14px;display:grid;gap:4px;align-content:center;min-width:150px}
.scale .sb{height:6px;border:2px solid var(--ink);border-top:0}
.scale span{font:400 11px var(--mono);color:var(--ink2)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font:400 12px var(--mono);padding:7px 10px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .1s;z-index:6}
.tip b{color:var(--yel);font-weight:500}
.toast{position:absolute;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font:400 12px var(--mono);padding:9px 14px;border-radius:4px;z-index:7}
.sheet-t{display:none}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:980px){
  .brand span,.links a.atlas-hide{display:none}
  .panel{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;max-height:46%}
  .panel.closed .pbody{display:none}
  .card{top:auto;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-height:52%}
  
  .bottom{flex-wrap:wrap}.ov{flex-basis:100%}
  .sheet-t{display:block;border:0;background:none;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);cursor:pointer;padding:0}
  .search{flex:1 1 auto}
}
@media(max-width:760px){
  .top{flex-wrap:wrap;gap:8px;padding-top:10px}
  .brand{padding:7px 11px}.brand b{font-size:16px}
  .links a{padding:7px 9px;font-size:10px}.links a:not(.keep){display:none}
  .search{order:3;flex:1 1 100%}
  .scale{display:none}
  .panel{bottom:calc(152px + env(safe-area-inset-bottom,0px));max-height:52%}
  .card{bottom:calc(152px + env(safe-area-inset-bottom,0px));max-height:58%;padding:14px 16px}
  .wbig b{font-size:38px}.card h2{font-size:22px}
  .pics{grid-template-columns:1fr 1fr;max-width:260px}
}
.card .close{display:none;border:1px solid var(--hair);background:var(--paper);border-radius:4px;height:28px;padding:0 9px;cursor:pointer;font:500 11px var(--mono)}
@media(max-width:980px){.card .close{display:inline-block}}
</style>
</head>
<body>
<div class="app">
  <svg id="map" aria-label="Map of Old Nagardas Road footpath"></svg>
  <div class="tip" id="tip"></div>
  <header class="top">
    <div class="brand"><b>Old Nagardas Road</b><span>ANDHERI EAST · 220 M · 15 WALKS · OCT 2026</span></div>
    <div class="search"><input id="q" type="search" placeholder="Search a place or a metre, e.g. bins, 120 m" autocomplete="off"><div class="sugg" id="sugg" hidden></div></div>
    <div class="grow"></div>
    <nav class="links"><a href="index.html" class="atlas-hide">Atlas of views</a><a href="index.html#make">Make</a><a href="index.html#connect">Data</a><a href="index.html#uses" class="keep">Uses</a></nav>
  </header>
  <aside class="panel" id="panel">
    <div class="ph"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lab">Use the map for</span><button class="sheet-t" id="sheetT">Hide</button></div><div class="modes" id="modes"></div></div>
    <div class="pbody" id="pbody"></div>
  </aside>
  <aside class="card" id="card"></aside>
  <div class="bottom">
    <div class="scale"><div class="sb" id="sb"></div><span id="sbl">10 m</span></div>
    <div class="ov"><svg id="ov" aria-label="Overview of the whole street"></svg></div>
    <div class="ctl"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="fit" title="Whole street">⤢</button><button id="d2" aria-pressed="true" title="Plan">2D</button><button id="d3" aria-pressed="false" title="Three-dimensional">3D</button></div>
  </div>
</div>
<script src="../lab/data.js"></script>
<script>
'use strict';
const D = window.LAB, NB = 22, L = 220, OBS = 1.4, NA = i => i >= 16 && i <= 18, U = 10;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = Object.fromEntries(['ink','ink2','ink3','hair','paper','ground','bldg','bldg2','road','kerb','taken','walk','mus','yel','red','amb','teal','navy','fix','veh','ppl','tree'].map(k => [k, css('--' + k)]));
const med = a => { const s = a.slice().sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; };
const walks = D.walks.map((w, k) => ({ ...w, k }));
const wlabel = w => `Day ${w.day} · ${w.dir === 'forward' ? 'A→B' : 'B→A'}${w.night ? ' · night' : ''}`;
const topOf = e => { if (!e) return .5; const a = e[0], b = 1 - e[1]; return a + b > .02 ? a / (a + b) : .5; };
const edges = c => { const gg = Math.min(3, c.g), a1 = (3 - gg) * c.top; return [a1, a1 + gg]; };
const PLACES = [['R.K. Chouhan Communications', 2, 'start · A'], ['Shopfronts', 45, 'crowded stretch'], ['Green bins', 85, 'narrowest point'], ['Turn onto highway service road', 104, 'junction'], ['Underpass walkway', 176, 'not measured inside'], ['Amratlal G. Vasani', 216, 'end · B']];
const placeOf = m => (m < 40 ? 'Near R.K. Chouhan Communications' : m < 76 ? 'Shopfronts' : m < 95 ? 'Green bins' : m < 115 ? 'Turn to the service road' : m < 160 ? 'Towards the underpass' : m < 191 ? 'Underpass walkway' : 'Near Amratlal G. Vasani');
const state = { mode: 'walk', sel: 8, d3: false, thr: .9, src: 'day', vb: null, layers: {} };

/* ---------- data ---------- */
function W() { return state.src === 'day' ? walks.filter(w => !w.night) : state.src === 'all' ? walks : walks.filter(w => w.k === +state.src); }
function stats() {
  const all = state.src === 'day' || state.src === 'all' ? walks : W(), day = all.filter(w => !w.night), night = walks.filter(w => w.night);
  return Array.from({ length: NB }, (_, i) => {
    const dr = day.map(w => w.s[i]).filter(Boolean), nr = night.map(w => w.s[i]).filter(Boolean), ar = all.map(w => w.s[i]).filter(Boolean);
    const gs = dr.filter(r => r.g > 0).map(r => r.g), ngs = nr.filter(r => r.g > 0).map(r => r.g), es = dr.filter(r => r.e).map(r => r.e);
    const share = k => dr.length ? dr.filter(r => r.ks.includes(k)).length / dr.length : 0;
    const sh = { fixed: Math.max(share('pole'), share('plants'), share('barrier')), vehicle: share('vehicle'), people: share('people') };
    return { i, g: NA(i) || !gs.length ? null : med(gs), gN: gs.length, ok: gs.filter(g => g >= state.thr).length,
      ng: NA(i) || ngs.length < 2 ? null : med(ngs), top: es.length ? topOf([med(es.map(e => e[0])), med(es.map(e => e[1]))]) : .5,
      b: ar.filter(r => r.o >= OBS).length, n: ar.length, sw: all.filter(w => w.swerves.some(m => m >= i * 10 && m < i * 10 + 10)).length,
      hk: all.reduce((s, w) => s + w.honks.filter(m => m >= i * 10 && m < i * 10 + 10).length, 0), lit: D.lit[i] ? D.lit[i].r : null, sh,
      pers: { vehicle: sh.vehicle >= .6, people: sh.people >= .9 }, fixedOn: sh.fixed >= .4 || i === 8 };
  });
}
function dets(S) { const ws = W().filter(w => !w.night);
  return D.dets.filter(d => ws.some(w => w.day === d[4] && (w.dir === 'forward') === (d[3] === 'f'))).map(d => { const i = Math.min(21, Math.floor(d[0] / 10)), s = S[i], [e1, e2] = s.g != null ? edges(s) : [0, 3];
    const owner = ['pole', 'plants', 'barrier'].includes(d[2]) ? 'fixed' : (d[2] === 'vehicle' ? s.pers.vehicle : s.pers.people) ? 'persistent' : 'dynamic';
    return { m: d[0], a: Math.max(.15, Math.min(3.7, e1 + d[1] * (e2 - e1))), k: d[2], owner }; }); }
const access = s => { if (NA(s.i) || !s.gN) return null; const r = s.ok / s.gN; return r >= .75 ? 'usually' : r >= .5 ? 'sometimes' : 'rarely'; };
const ACC = { usually: C.teal, sometimes: C.amb, rarely: C.red };
const wcol = g => g == null ? null : g >= 1.5 ? C.teal : g >= .9 ? C.amb : C.red;
const KCOL = { people: C.ppl, vehicle: C.veh, pole: C.fix, barrier: C.fix, plants: C.tree };
const OCOL = { fixed: C.fix, persistent: C.veh, dynamic: C.ppl };

/* ---------- modes ---------- */
const MODES = {
  walk: { n: 'Walking', s: 'where it is hard to walk', q: 'Where is it hard to walk?', L: { width: 'class', obst: 'kind', swerve: 1, horn: 0, night: 0, chain: 1, places: 1 },
    sum(S) { const t = S.filter(s => s.g != null).sort((a, b) => a.g - b.g).slice(0, 5); return rows(t, s => `${s.g.toFixed(1)} m`, s => s.g < .9 ? 'you step into the road' : `blocked on ${s.b} of ${s.n} walks`) + `<p class="note">Narrowest stretches first · clear width is the daytime median</p>`; } },
  access: { n: 'Wheelchair & pram', s: 'can I get through?', q: 'Can I get through?', L: { width: 'access', obst: 'kind', swerve: 0, horn: 0, night: 0, chain: 1, places: 1 },
    sum(S) { const c = { usually: 0, sometimes: 0, rarely: 0 }; S.forEach(s => { const a = access(s); if (a) c[a]++; });
      return `<div class="slider"><span class="lab">Needs</span><input id="thr" type="range" min="0.6" max="1.8" step="0.1" value="${state.thr}"><b>${state.thr.toFixed(1)} m</b></div>
      <div class="big3"><div><b style="color:var(--teal)">${c.usually}</b><span>usually through</span></div><div><b style="color:var(--amb)">${c.sometimes}</b><span>sometimes</span></div><div><b style="color:var(--red)">${c.rarely}</b><span>rarely</span></div></div>
      ${rows(S.filter(s => access(s) === 'rarely' || access(s) === 'sometimes').sort((a, b) => a.ok / a.gN - b.ok / b.gN).slice(0, 4), s => `${s.ok}/${s.gN}`, s => `walks with ${state.thr.toFixed(1)} m clear`)}
      <p class="note">Each 10 m counts the daytime walks with at least the width you need. 0.9 m is an assumed minimum, to confirm with users.</p>`; } },
  night: { n: 'After dark', s: 'is it safe at night?', q: 'Is it safe after dark?', L: { width: 'night', obst: 0, swerve: 0, horn: 0, night: 1, chain: 1, places: 1 },
    sum(S) { const t = S.filter(s => s.lit != null && s.lit < .9).sort((a, b) => a.lit - b.lit).slice(0, 5); return rows(t, s => `−${Math.round((1 - s.lit) * 100)}%`, s => s.ng != null ? `${s.ng.toFixed(1)} m clear at night` : 'night width not measured') + `<p class="note">Brightness of the walking surface in night photos against the route’s usual night. Phones adjust exposure, so this ranks stretches; it is not lux. 4 night walks.</p>`; } },
  act: { n: 'Who must act', s: 'whose problem each stretch is', q: 'Whose problem is each stretch?', L: { width: 'plain', obst: 'owner', swerve: 0, horn: 0, night: 0, chain: 1, places: 1 },
    sum(S) { const need = S.filter(s => s.g != null && s.g < 1.5); const grp = { works: [], enforce: [], parking: [] };

let STATS = stats();
function setMode(k) { state.mode = k; state.layers = { ...MODES[k].L }; renderPanel(); draw(); }
function renderPanel() { STATS = stats(); const M = MODES[state.mode];
  document.getElementById('modes').innerHTML = Object.entries(MODES).map(([k, m]) => `<button class="mode" data-m="${k}" aria-pressed="${k === state.mode}"><b>${m.n}</b><span>${m.s}</span></button>`).join('');
  const legend = { walk: [[C.teal, '1.5 m or more · meets BMC'], [C.amb, '0.9–1.5 m · tight'], [C.red, 'under 0.9 m · you step into the road'], [C.taken, 'taken'], [C.mus, 'swerve']], access: [[C.teal, 'usually through'], [C.amb, 'sometimes'], [C.red, 'rarely'], [C.taken, 'taken']],
    night: [[C.navy, 'darker at night'], ['#DCE3F2', 'night walkable width'], [C.walk, 'day width (dashed)']], act: [[C.fix, 'fixed · civil works'], [C.veh, 'on most walks · enforcement'], [C.ppl, 'on some walks · time-based']],
    vend: [[C.ppl, 'people & stalls'], [C.walk, 'walkable'], [C.taken, 'taken']], stress: [[C.red, 'horn heard'], [C.mus, 'swerve'], [C.taken, 'taken']] }[state.mode];
  const objLeg = state.layers.obst === 'kind' ? [[C.ppl, 'people & stalls'], [C.veh, 'vehicles'], [C.fix, 'poles & barriers'], [C.tree, 'trees']] : [];
  document.getElementById('pbody').innerHTML = `<h3 class="q">${M.q}</h3>${M.sum(STATS)}
    <div><div class="lab" style="margin-bottom:6px">Legend</div><div class="legend">${[...legend, ...objLeg, ['url', 'not measured · underpass']].map(([c, l]) => `<div><i style="background:${c === 'url' ? 'repeating-linear-gradient(45deg,var(--paper) 0 3px,var(--hair) 3px 5px)' : c};${c === C.walk ? 'border:1px solid var(--hair)' : ''}"></i>${l}</div>`).join('')}</div></div>
    <div><div class="lab" style="margin-bottom:6px">Layers</div><div class="layers">${LAYERS.map(([k, l, c]) => `<label><input type="checkbox" data-l="${k}" ${state.layers[k] ? 'checked' : ''}>${l}<i style="background:${c};${k === 'width' ? 'border:1px solid var(--hair)' : ''}"></i></label>`).join('')}</div></div>
    <div><div class="lab" style="margin-bottom:6px">Walks shown</div><select class="walk" id="src"><option value="day" ${state.src === 'day' ? 'selected' : ''}>All 11 daytime walks</option><option value="all" ${state.src === 'all' ? 'selected' : ''}>All 15 walks, day and night</option>${walks.map(w => `<option value="${w.k}" ${String(state.src) === String(w.k) ? 'selected' : ''}>One walk · ${wlabel(w)}</option>`).join('')}</select></div>
    <p class="note">Walked on one side of the road · widths are camera estimates from walk photos, not tape-measured · Oct 2026.</p>`;
  renderCard(); }
function renderCard() { const i = state.sel, s = STATS[i], Pp = D.photos, dp = Pp.df[i] || Pp.dr[i], np = Pp.nr[i];
  const v = NA(i) ? ['v-na', 'not measurable here'] : s.g == null ? ['v-na', 'no reading'] : s.g >= 1.5 ? ['v-ok', 'meets BMC 1.5 m'] : s.g >= .9 ? ['v-warn', 'tight'] : ['v-bad', 'you step into the road'];
  const pic = (p, cap) => `<figure class="pic"><div class="im">${p ? `<img src="../lab/ph/${p.id}.jpg" alt="${cap} photo of this stretch" onerror="this.remove()">${p.path && p.path.length > 5 ? `<svg viewBox="0 0 1 1" preserveAspectRatio="none"><polygon points="${p.path.map(q => q.join(',')).join(' ')}" fill="rgba(242,184,0,.28)" stroke="#F2B800" stroke-width=".006"/></svg>` : ''}` : ''}</div><figcaption>${cap}</figcaption></figure>`;
  const bar = (l, x, c) => `<div class="bar"><span>${l}</span><span class="tr"><i style="width:${Math.round(x * 100)}%;background:${c}"></i></span><em>${Math.round(x * 100)}%</em></div>`;
  const owners = []; if (s.fixedOn) owners.push('civil works for fixed things'); if (s.pers.people || s.sh.people >= .7) owners.push('enforcement for stalls and crowds'); if (s.pers.vehicle || s.sh.vehicle >= .5) owners.push('traffic and parking for vehicles');
  const acc = access(s), lit = s.lit == null ? '—' : s.lit < 1 ? `−${Math.round((1 - s.lit) * 100)}%` : `+${Math.round((s.lit - 1) * 100)}%`;
  document.getElementById('card').innerHTML = `<div class="x"><span class="ch">${i * 10}–${i * 10 + 10} m</span><span class="nav"><button data-step="-1" aria-label="Previous stretch">‹</button><button data-step="1" aria-label="Next stretch">›</button><button class="close" data-close="1">Close</button></span></div>
    <h2>${placeOf(i * 10 + 5)}</h2><div class="wbig"><b>${s.g == null ? '—' : s.g.toFixed(1)}</b><span>${s.g == null ? '' : 'm clear · daytime median'}</span></div><span class="verdict ${v[0]}">${v[1]}</span>
    <div class="pics">${pic(dp, 'WORST DAY PHOTO · GROUND TRACED')}${pic(np, 'NIGHT')}</div>
    <div class="stats"><div class="stat"><b>${s.b}<small style="font-size:12px;color:var(--ink3)">/${s.n}</small></b><span>walks blocked</span></div><div class="stat"><b>${acc ? s.ok + '/' + s.gN : '—'}</b><span>walks with ${state.thr.toFixed(1)} m for a wheelchair</span></div>
    <div class="stat"><b>${s.sw}</b><span>walks swerved</span></div><div class="stat"><b>${s.hk}</b><span>horns heard</span></div>
    <div class="stat"><b>${s.ng == null ? '—' : s.ng.toFixed(1)}</b><span>m clear at night</span></div><div class="stat"><b>${lit}</b><span>light vs route at night</span></div></div>
    <div class="bars"><div class="lab">Seen here on daytime walks</div>${bar('Fixed things', s.sh.fixed, C.fix)}${bar('Vehicles', s.sh.vehicle, C.veh)}${bar('People & stalls', s.sh.people, C.ppl)}</div>
    ${s.g != null && s.g < 1.5 && owners.length ? `<div class="who">Under BMC 1.5 m. Likely needs <b>${owners.join(', ')}</b>.</div>` : ''}
    <div class="acts"><button class="btn" data-ev="1">Save evidence sheet</button><button class="btn ghost" data-zoom="1">Zoom here</button></div>`; }
function select(i, flyTo) { state.sel = Math.max(0, Math.min(21, i)); renderCard(); document.getElementById('card').hidden = false; if (innerWidth <= 980) document.getElementById('panel').hidden = true; draw(); if (flyTo) fly(focusBox(state.sel * 10 + 5, 50)); }
document.getElementById('modes').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) setMode(b.dataset.m); });
document.getElementById('pbody').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) select(+b.dataset.go, true); });
document.getElementById('pbody').addEventListener('change', e => { if (e.target.dataset.l) { const k = e.target.dataset.l; state.layers[k] = e.target.checked ? (MODES[state.mode].L[k] || (k === 'obst' ? 'kind' : k === 'width' ? 'plain' : 1)) : 0; renderPanel(); draw(); } if (e.target.id === 'src') { state.src = e.target.value; renderPanel(); draw(); } });
document.getElementById('pbody').addEventListener('input', e => { if (e.target.id === 'thr') { state.thr = +e.target.value; const b = e.target.parentNode.querySelector('b'); b.textContent = state.thr.toFixed(1) + ' m'; clearTimeout(renderPanel.t); renderPanel.t = setTimeout(() => { renderPanel(); draw(); const t = document.getElementById('thr'); t && t.focus(); }, 120); } });
document.getElementById('card').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.step) select(state.sel + +b.dataset.step, true); if (b.dataset.zoom) fly(focusBox(state.sel * 10 + 5, 30)); if (b.dataset.ev) saveEvidence(); if (b.dataset.close) { document.getElementById('card').hidden = true; document.getElementById('panel').hidden = false; } });
document.getElementById('sheetT').addEventListener('click', e => { const p = document.getElementById('panel'); p.classList.toggle('closed'); e.target.textContent = p.classList.contains('closed') ? 'Show' : 'Hide'; });
document.getElementById('zin').onclick = () => zoomAt(.6, innerWidth / 2, innerHeight / 2);
document.getElementById('zout').onclick = () => zoomAt(1.6, innerWidth / 2, innerHeight / 2);
document.getElementById('fit').onclick = () => fly(fitBox());
const set3 = on => { const m = state.vb ? toWorld(innerWidth / 2, innerHeight / 2)[0] : 110, w = state.vb ? state.vb[2] / U : 230; state.d3 = on; document.getElementById('d2').setAttribute('aria-pressed', !on); document.getElementById('d3').setAttribute('aria-pressed', on); draw(); const f = fitBox(); setVB(w > 180 ? f : focusBox(Math.max(0, Math.min(L, m)), Math.min(w, 200)), true); };
document.getElementById('d2').onclick = () => set3(false); document.getElementById('d3').onclick = () => set3(true);
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; if (e.key === 'ArrowRight') select(state.sel + 1, true); if (e.key === 'ArrowLeft') select(state.sel - 1, true); if (e.key === '+' || e.key === '=') zoomAt(.7, innerWidth / 2, innerHeight / 2); if (e.key === '-') zoomAt(1.4, innerWidth / 2, innerHeight / 2); });
addEventListener('resize', () => { if (state.vb) setVB(state.vb, true); });

/* ---------- search ---------- */
const q = document.getElementById('q'), sugg = document.getElementById('sugg');
function matches(v) { v = v.trim().toLowerCase(); if (!v) return PLACES.map(p => [p[0], p[1], p[2]]); const num = v.match(/^(\d{1,3})\s*m?$/); const out = [];
  if (num && +num[1] <= L) out.push([`${num[1]} m along the street`, +num[1], placeOf(+num[1]).toLowerCase()]);
  PLACES.forEach(p => { if (p[0].toLowerCase().includes(v) || p[2].includes(v)) out.push(p); });
  if ('bin bins dustbin'.includes(v)) out.push(PLACES[2]); return [...new Map(out.map(o => [o[0], o])).values()].slice(0, 6); }
function showSugg() { const list = matches(q.value); sugg.hidden = !list.length; sugg.innerHTML = list.map((p, j) => `<button data-m="${p[1]}" class="${j === 0 ? 'on' : ''}">${p[0]}<small>${p[2]}</small></button>`).join(''); }
q.addEventListener('focus', showSugg); q.addEventListener('input', showSugg);
q.addEventListener('keydown', e => { if (e.key === 'Enter') { const b = sugg.querySelector('button'); if (b) { b.click(); } } if (e.key === 'Escape') { sugg.hidden = true; q.blur(); } });
sugg.addEventListener('mousedown', e => { const b = e.target.closest('button'); if (!b) return; e.preventDefault(); const m = +b.dataset.m; q.value = b.firstChild.textContent; sugg.hidden = true; q.blur(); select(Math.min(21, Math.floor(m / 10)), true); });
sugg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const m = +b.dataset.m; q.value = b.firstChild.textContent; sugg.hidden = true; q.blur(); select(Math.min(21, Math.floor(m / 10)), true); });
q.addEventListener('blur', () => setTimeout(() => sugg.hidden = true, 150));

/* ---------- evidence sheet ---------- */
function toast(msg) { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.querySelector('.app').appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3000); }
async function saveFile(name, data, type) { const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) { try { await dl.save({ filename: name, data }); } catch (e) { if (!e || e.code !== 'declined') toast('Could not save the file.'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function saveEvidence() { const i = state.sel, s = STATS[i], esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const lines = [['Location', `Old Nagardas Road, Andheri East (K/East ward) · ${i * 10}–${i * 10 + 10} m from R.K. Chouhan Communications`], ['Clear walkway', s.g == null ? 'not measurable here' : `${s.g.toFixed(1)} m (median of ${s.gN} daytime photos) · BMC Universal Footpath Policy minimum 1.5 m`], ['Blocked', `${s.b} of ${s.n} walks`], ['Walkers swerved', `${s.sw} walks`], ['Horns heard', `${s.hk}`], ['Seen on daytime walks', `fixed things ${Math.round(s.sh.fixed * 100)}% · vehicles ${Math.round(s.sh.vehicle * 100)}% · people and stalls ${Math.round(s.sh.people * 100)}%`], ['At night', s.ng == null ? 'width not measured' : `${s.ng.toFixed(1)} m clear`], ['Method', 'Walks recorded in Oct 2026 on one side of the road; widths are camera estimates from walk photos, not tape-measured.']];
  const svgTxt = `<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="0 0 210 148"><rect width="210" height="148" fill="#fff"/><text x="12" y="18" font-family="Georgia" font-size="9">Footpath evidence · ${esc(placeOf(i * 10 + 5))}</text>${lines.map((l, j) => `<text x="12" y="${32 + j * 13}" font-family="Arial" font-size="3.4" fill="#777">${esc(l[0].toUpperCase())}</text><text x="12" y="${37 + j * 13}" font-family="Arial" font-size="4.2">${esc(l[1])}</text>`).join('')}</svg>`;
  saveFile(`footpath-evidence-${i * 10}-${i * 10 + 10}m.svg`, svgTxt, 'image/svg+xml'); }

/* ---------- start ---------- */
state.layers = { ...MODES.walk.L };
renderPanel();
if (innerWidth <= 980) { document.getElementById('card').hidden = true; document.getElementById('panel').classList.add('closed'); document.getElementById('sheetT').textContent = 'Show'; } K = 1; draw(); setVB(fitBox(), true);
setTimeout(() => fly(focusBox(85, window.innerWidth < 760 ? 40 : 90), 900), 500);
document.fonts && document.fonts.ready.then(() => draw());
</script>
</body>
</html>
