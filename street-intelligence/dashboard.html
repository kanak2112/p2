<style>
/* Layout: map-first research console. Icon rail of modules on the left, the corridor plan filling the stage, one floating analysis panel per module, a report button and legend floating on the map. On phones: map on top, panel as a sheet, rail as a bottom tab bar. */
:root {
  --ground: #E9ECE6; --block: #D9DED5; --street: #FFFFFF; --panel: #FFFFFF; --panel2: #F2F4EF; --line: #D3D8CF; --ink: #18211C; --ink2: #536058; --ink3: #85908A;

  --rare: #1AA6C0; --some: #F5B014; --most: #9F1D1D; --none: #B7BDB5;
  --f-display: "Familjen Grotesk", "Public Sans", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #101513; --block: #1A211D; --street: #26302B; --panel: #171D1A; --panel2: #1F2622; --line: #2E3832; --ink: #E6ECE8; --ink2: #A6B1AA; --ink3: #7A857F;
  --rail: #0B0F0D; --rail-ink: #8F9A94; --rail-on: #FFFFFF;
  --accent: #8DB4E6; --accent-soft: #22324A; --alert: #F2A49B; --alert-soft: #3A1E1C; --report: #F0695C; --change: #B98AE6; --virtual: #FB8B4B; --ok: #4CC08A; --none: #4A524D; color-scheme: dark } }
:root[data-theme="dark"] {
  --ground: #101513; --block: #1A211D; --street: #26302B; --panel: #171D1A; --panel2: #1F2622; --line: #2E3832; --ink: #E6ECE8; --ink2: #A6B1AA; --ink3: #7A857F;
  --rail: #0B0F0D; --rail-ink: #8F9A94; --rail-on: #FFFFFF;
  --accent: #8DB4E6; --accent-soft: #22324A; --alert: #F2A49B; --alert-soft: #3A1E1C; --report: #F0695C; --change: #B98AE6; --virtual: #FB8B4B; --ok: #4CC08A; --none: #4A524D; color-scheme: dark }

.panel .pfoot { padding: 8px 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink3) }
select, input[type="text"], input[type="number"], input[type="date"], textarea { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; width: 100%; min-width: 0 }
.sel-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center }
.datechip { font-family: var(--f-mono); font-size: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; white-space: nowrap }
.insight { background: var(--alert-soft); color: var(--ink); border-left: 4px solid var(--alert); border-radius: 8px; padding: 9px 11px; font-size: 13px }
.insight.ok { border-left-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--panel)) }
.insight.watch { border-left-color: var(--some); background: color-mix(in srgb, var(--some) 16%, var(--panel)) }
.sev { display: grid; gap: 4px }

.tiles4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px }
.stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; display: grid; gap: 1px }
.stat .v { font-family: var(--f-display); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums }
.stat .d { font-size: 11px; color: var(--ink2) }
.chart svg { display: block; width: 100%; height: auto }
.chart svg text { font-family: var(--f-body); fill: var(--ink2); font-size: 10px }
.chart .cell { cursor: pointer }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--ink2) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px }
.sect { display: grid; gap: 8px }

.list { display: grid; gap: 6px }

.tile { border: 0; background: none; padding: 0; text-align: left; display: grid; gap: 2px; font-size: 10.5px; color: var(--ink2) }
.ph { position: relative; width: 100%; aspect-ratio: 338 / 600; max-width: 100%; border-radius: 6px; overflow: hidden; background-color: var(--panel2); background-repeat: no-repeat; border: 2px solid var(--none) }

table.t { width: 100%; border-collapse: collapse; font-size: 12px }

.bar { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden } .bar i { display: block; height: 100% }

.picto { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px }
.picto button { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 6px 2px; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; line-height: 1.15; text-align: center }
.picto button[aria-pressed="true"] { border-color: var(--report); background: var(--alert-soft) }
.picto svg { width: 46px; height: 34px }
.votes { display: flex; gap: 6px }
.votes button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 9px; font-size: 12px }
.votes button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.note { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: grid; gap: 2px } .note .who { font-size: 11px; color: var(--ink3) }
textarea { min-height: 64px; resize: vertical }
.lb { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.82); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.lb .card { background: var(--panel); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; max-width: 420px; width: 100% }
.lb .ph { height: 66vh; width: auto; justify-self: center }

@media (max-width: 900px) {
  body { overflow: auto }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 46vh auto; height: auto; min-height: 100% }
  .rail { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; flex-direction: row; overflow-x: auto; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); gap: 2px; justify-content: flex-start }
  .rail .logo, .rail .sp { display: none }
  .rail button { width: 62px; flex: none }
  .stage-wrap { height: auto }
  .stage { height: auto; overflow: visible }
  #plan { position: relative; height: 46vh }
  .mapctl { bottom: auto; top: calc(46vh - 44px) }
  .topbar { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)) }
  .report-cta { display: none }
  .mapctl { left: max(12px, env(safe-area-inset-left, 0px)) }
  .panel { margin-top: 12px }
  .legend-f { display: none }
  .panel { position: static; width: auto; margin: 0 max(12px, env(safe-area-inset-left, 0px)) 96px max(12px, env(safe-area-inset-right, 0px)); box-shadow: none }
  .panel .pbody { overflow: visible }
  .topbar .chipbar.filters { display: none }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="app">
  <nav class="rail" aria-label="Modules" id="rail"></nav>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div id="plan" aria-label="Plan of the footpath"></div>
      <div class="topbar">
        <span class="title-chip">Street Intelligence Lab</span>
        <div class="chipbar filters" role="group" aria-label="Filters">
          <span class="lab">Days</span><span id="daysA" class="row"></span>
          <span class="lab">Way</span><div class="seg" id="dirSeg"><button type="button" data-v="both" aria-pressed="true">Both</button><button type="button" data-v="forward">A → B</button><button type="button" data-v="return">B → A</button></div>
          <span class="lab">Light</span><div class="seg" id="lightSeg"><button type="button" data-v="any" aria-pressed="true">Any</button><button type="button" data-v="daylight">Day</button><button type="button" data-v="night">Night</button></div>
        </div>
        <div class="report-cta"><b>Seen a blocked footpath here?</b><span class="small muted">Report it with what blocks it and how much room is left.</span><button type="button" class="btn red" data-mod="reports">Report</button></div>
      </div>
      <div class="mapctl">
        <div class="seg" id="orientSeg" aria-label="Orientation"><button type="button" data-v="north" aria-pressed="true">North up</button><button type="button" data-v="walk">Walking way up</button></div>
        <div class="seg" id="zoomSeg" aria-label="Scale"><button type="button" data-v="all" aria-pressed="true">220 m</button><button type="button" data-v="near">60 m</button></div>
      </div>
      <div class="legend-f" id="legendF"></div>
      <section class="panel" id="panel" aria-live="polite">
        <div class="phead" id="phead"></div>
        <div class="pbody" id="panelBody"></div>
        <div class="pfoot"><span id="corrName"></span> · <span id="dbStatus">Connecting…</span></div>
      </section>
    </div>
  </div>
</div>

<script src="data/manifest.js"></script>
<script>
(() => {
'use strict';
const RAW = window.STREET_DATA;
const $ = id => document.getElementById(id);
if (!RAW || !RAW.days) { $('panelBody').textContent = 'The footpath data did not load. Check that data/manifest.js sits next to this page.'; return; }

/* ---------- Constants (same rules as the mobile map) ---------- */
const L = RAW.corridor.length_m, NB = Math.ceil(L / 10), OBS = 1.4, NEAR = 1.4;
const binOf = m => Math.min(NB - 1, Math.max(0, Math.floor(m / 10)));
const binName = i => `${i * 10}–${Math.min(L, i * 10 + 10)} m`;
const WIDTH = { C: 1.5, P: 1.0, I: 0.6 }, RK = { C: 0, P: 1, I: 2 };
const BANDCAT = { C: 'R', P: 'S', I: 'M' }, BANDRANGE = { C: '≥ 1.2 m', P: '0.8–1.2 m', I: '< 0.8 m' };
const CV = { R: 'var(--rare)', S: 'var(--some)', M: 'var(--most)', N: 'var(--none)' };
const HEX = { R: '#1AA6C0', S: '#F5B014', M: '#9F1D1D', N: '#AEB4AA' };
const DIRL = { forward: 'A → B', return: 'B → A' };
const LANDMARKS = [{ m: 80, name: 'Green bins' }, { m: 104, name: 'Turn: highway service road' }, { m: 162, m2: 191, name: 'Underpass walkway' }];
const bandOf = n => n.near_field >= NEAR ? 'I' : n.obstruction >= OBS ? 'P' : 'C';
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
const fmtDate = s => new Date(s + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const dayNum = s => Date.parse(s + 'T00:00:00Z') / 864e5;
const TODAY = Math.floor(Date.now() / 864e5);

const DAYS = RAW.days.filter(d => !d.mock).sort((a, b) => a.day - b.day);
const WALKS = [];
DAYS.forEach(d => ['forward', 'return'].forEach(key => { const w = d[key]; if (w) WALKS.push({ id: d.day + key[0], day: d.day, key, w, date: d.processed, light: w.lighting || 'daylight', dur: w.summary.duration_s }); }));
$('corrName').textContent = `${RAW.corridor.name} · ${RAW.corridor.city} · ward ${RAW.corridor.ward || ''} · ${L} m`;

/* ---------- State ---------- */
const store = { get(k, d) { try { const v = localStorage.getItem('sil-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('sil-' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } } };
const dates = [...new Set(WALKS.map(x => x.date))].sort();
const state = {
  daysA: new Set(DAYS.map(d => d.day)), daysB: new Set(), cmp: 'none', dir: 'both', light: 'any',
  metric: 'blocked', sel: 8, orient: 'north', zoom: 'all', scenario: store.get('scenario', 'clear'),
  layers: { landmarks: true, places: true, change: true, virtual: true, crossings: true, amenities: true },
  // Example change, used until someone tags a dated place: a split between the early and the later survey days.
  change: { name: 'Example change (move it to a real event)', m: 80, m2: 110, r: 30, date: dates[Math.floor(dates.length / 2)] || dates[0], example: true },
  mall: { name: 'Hypothetical mall entrance', m: 120, r: 60, example: true }
};

/* ---------- Statistics ---------- */
function worst(W, i) { let b = null; for (const n of W.w.nodes) if (binOf(n.meter) === i && (!b || n.obstruction > b.obstruction)) b = n; return b; }
const WORST = new Map(WALKS.map(W => [W.id, Array.from({ length: NB }, (_, i) => worst(W, i))]));
const newDir = () => ({ seen: 0, blocked: 0, b: { C: 0, P: 0, I: 0 }, wsum: 0 });
function typicalOf(b) { const t = ['I', 'P', 'C'].sort((x, y) => b[y] - b[x] || RK[y] - RK[x])[0]; return b[t] ? t : null; }
function stats(walks) {
  return Array.from({ length: NB }, (_, i) => {
    const s = { i, dir: { forward: newDir(), return: newDir() }, all: newDir(), ppl: [], veh: [], fix: [], veg: [], sky: [], swN: 0, horn: 0, tiles: [] };
    for (const W of walks) {
      const n = WORST.get(W.id)[i]; if (!n) continue;
      const bl = n.obstruction >= OBS, band = bandOf(n);
      for (const d of [s.dir[W.key], s.all]) { d.seen++; if (bl) d.blocked++; d.b[band]++; d.wsum += WIDTH[band]; }
      if (W.light === 'daylight') for (const x of W.w.nodes) if (binOf(x.meter) === i && x.seg) { s.ppl.push(x.seg.people); s.veh.push(x.seg.vehicles); s.fix.push(x.seg.fixed); s.veg.push(x.seg.vegetation); s.sky.push(x.seg.sky); }
      s.swN += (W.w.swerves || []).filter(e => binOf(e.m) === i).length;
      s.horn += (W.w.honks || []).filter(e => binOf(e.m) === i).reduce((a, e) => a + e.dur, 0);
      s.tiles.push({ W, n, bl, band });
    }
    for (const d of [s.all, s.dir.forward, s.dir.return]) { d.share = d.seen ? d.blocked / d.seen : null; d.width = d.seen ? d.wsum / d.seen : null; d.typical = typicalOf(d.b); }

function scenarioFinding(cur) {
  const S = SCEN[state.scenario], out = [], gaps = [];
  const seenOk = cur.filter(s => s.seen >= 3);
  if (state.scenario === 'clear') {
    const top = [...seenOk].sort((a, b) => b.share - a.share || a.width - b.width).slice(0, 3);
    top.forEach(s => { const cause = causeOf(s); out.push(`<b>${binName(s.i)}</b>${lmName(s.i) ? ' (' + lmName(s.i) + ')' : ''}: blocked on ${s.all.blocked} of ${s.seen} walks (A → B ${frac(s.dir.forward)}, B → A ${frac(s.dir.return)})${cause ? '; mostly ' + cause : ''}.`); });
    const both = seenOk.filter(s => s.dir.forward.seen >= 2 && s.dir.return.seen >= 2 && s.dir.forward.share > 2 / 3 && s.dir.return.share > 2 / 3);
    if (both.length) out.push(`${both.length} stretch${both.length > 1 ? 'es are' : ' is'} blocked on most walks in both directions: ${both.map(s => binName(s.i)).join(', ')}.`);
  } else if (state.scenario === 'access') {
    for (const k of ['forward', 'return']) { const st = cur.filter(s => s.dir[k].seen && s.dir[k].width < 0.9); out.push(`<b>${DIRL[k]}</b>: ${st.length ? st.length + ' likely stop' + (st.length > 1 ? 's' : '') + ' (' + spans(st.map(s => s.i)) + ')' : 'no stretch under 0.9 m on most walks'}.`); }
    out.push('Widths are estimated from photos (0.6, 1.0 or 1.5 m per band), not tape-measured.');
  } else if (state.scenario === 'change') {
    const c = state.change, { before, after } = beforeAfter(), sb = stats(before), sa = stats(after);
    out.push(`Split on <b>${fmtDate(c.date)}</b> at ${c.m}${c.m2 ? '–' + c.m2 : ''} m (${esc(c.name)}): ${before.length} walks before, ${after.length} after.`);
    const zone = idxNear(c); const moved = zone.filter(i => sb[i].seen >= 2 && sa[i].seen >= 2).map(i => ({ i, d: sa[i].share - sb[i].share })).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    if (moved.length) out.push('Inside its radius: ' + moved.slice(0, 4).map(x => `${binName(x.i)} ${x.d > 0 ? 'worse' : x.d < 0 ? 'better' : 'unchanged'} (${pct(sb[x.i].share)} → ${pct(sa[x.i].share)} blocked)`).join('; ') + '.');
    else gaps.push('Too few walks on one side of the split inside the radius to compare. Walk it again.');
    const outside = cur.map(s => s.i).filter(i => !zone.includes(i) && sb[i].seen >= 2 && sa[i].seen >= 2), dOut = mean(outside.map(i => sa[i].share - sb[i].share));
    if (dOut != null) out.push(`Outside the radius blocked share moved ${dOut >= 0 ? '+' : ''}${Math.round(dOut * 100)} points on average. If inside moved much more, the change is a plausible cause; if both moved alike, something street-wide (season, weekday, weather) is more likely.`);
    if (c.example) gaps.push('This is an example split. Tag the real change with its date in Places.');
  } else if (state.scenario === 'mall') {
    const m = state.mall, zone = idxNear(m), tight = zone.filter(i => cur[i].seen && cur[i].width < 1.2);
    out.push(`<b>${esc(m.name)}</b> at ${m.m} m, catchment ${m.r} m: ${zone.length} stretches (${spans(zone)}).`);
    out.push(tight.length ? `Pressure points, already under 1.2 m on average: ${tight.map(i => `${binName(i)} (${cur[i].width.toFixed(2)} m, blocked ${pct(cur[i].share)})`).join('; ')}.` : 'No stretch in the catchment is under 1.2 m on average.');
    out.push('Design response to test: widen or clear these first, and add a crossing where the entrance meets the road.');
  } else if (state.scenario === 'night') {
    const d = stats(WALKS.filter(W => W.key === 'return' && W.light === 'daylight')), n = stats(WALKS.filter(W => W.key === 'return' && W.light === 'night'));
    const worse = d.map((s, i) => ({ i, dd: s.seen && n[i].seen ? n[i].share - s.share : null })).filter(x => x.dd != null && x.dd > 0.2);
    out.push(`B → A, ${WALKS.filter(W => W.key === 'return' && W.light === 'daylight').length} day walks against ${WALKS.filter(W => W.key === 'return' && W.light === 'night').length} night walks.`);
    out.push(worse.length ? `Worse at night by more than 20 points: ${worse.map(x => binName(x.i)).join(', ')}.` : 'No stretch is clearly worse at night.');
    gaps.push('No A → B walk at night yet. Walk A → B after dark to compare both ways.');
  } else out.push('Choose a scenario above for a guided task, or read the charts directly.');
  cur.forEach(s => { if (s.seen && s.seen < 3) gaps.push(`${binName(s.i)}: only ${s.seen} walk${s.seen > 1 ? 's' : ''} in this view.`); });
  if (WALKS.some(W => TODAY - dayNum(W.date) > 90)) gaps.push('Some walks are over 90 days old. Re-walk before relying on them.');
  return { out, gaps: [...new Set(gaps)].slice(0, 6) };
}
const frac = d => d.seen ? `${d.blocked}/${d.seen}` : '–';
const lmName = i => LANDMARKS.filter(l => binOf(l.m) === i || (l.m2 && i >= binOf(l.m) && i <= binOf(l.m2))).map(l => l.name).join(', ');
const causeOf = s => { const c = [['people', s.people], ['parked or moving vehicles', s.vehicles], ['poles, signs and fences', s.fixed]].filter(x => x[1] != null).sort((a, b) => b[1] - a[1])[0]; return c && c[1] > 0.03 ? c[0] : ''; };

/* ---------- Geometry of the plan (same footpath line as the mobile map) ---------- */
const ROAD = [[348.1, 270], [168.1, 381.6], [158.8, 411.8], [181.8, 459.4], [45, 522.7]], OFF = 9;
const FP = (() => { const n = ROAD.length, segN = []; for (let j = 0; j < n - 1; j++) { const dx = ROAD[j + 1][0] - ROAD[j][0], dy = ROAD[j + 1][1] - ROAD[j][1], l = Math.hypot(dx, dy); segN.push([-dy / l, dx / l]); } return ROAD.map((p, j) => { const a = segN[Math.max(0, j - 1)], b = segN[Math.min(n - 2, j)]; let mx = a[0] + b[0], my = a[1] + b[1]; const ml = Math.hypot(mx, my); mx /= ml; my /= ml; const cos = mx * b[0] + my * b[1]; return [p[0] + mx * OFF / cos, p[1] + my * OFF / cos]; }); })();
const FPC = [0]; for (let j = 1; j < FP.length; j++) FPC.push(FPC[j - 1] + Math.hypot(FP[j][0] - FP[j - 1][0], FP[j][1] - FP[j - 1][1]));
const FPLEN = FPC[FPC.length - 1], UPM = FPLEN / L;
function along(m) { const t = Math.max(0, Math.min(L, m)) / L * FPLEN; let j = 0; while (j < FP.length - 2 && FPC[j + 1] < t) j++; const u = (t - FPC[j]) / (FPC[j + 1] - FPC[j]); return [FP[j][0] + (FP[j + 1][0] - FP[j][0]) * u, FP[j][1] + (FP[j + 1][1] - FP[j][1]) * u]; }
function normalAt(m) { const a = along(Math.max(0, m - 2)), b = along(Math.min(L, m + 2)), dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; }
const pts = (m0, m1) => { const p = []; for (let m = m0; m <= m1 + 1e-6; m += 2) p.push(along(Math.min(m, m1))); return p.map(q => q.map(v => v.toFixed(1)).join(',')).join(' '); };

/* ---------- Interaction ---------- */

  else if (t.id === 'chgSel') { if (t.value === 'example') state.change = { name: 'Example change (tag the real one in Places)', m: 80, m2: 110, r: 30, date: dates[Math.floor(dates.length / 2)], example: true }; else { const p = PLACES.find(x => x.id === t.value); if (p) state.change = { id: p.id, name: p.name, m: p.m, m2: p.m2 ?? null, r: p.r ?? 40, date: p.date }; } }
  else return;
  render();
});
let simT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'mallM') state.mall.m = +t.value; else if (t.id === 'mallR') state.mall.r = +t.value; else return;
  t.nextElementSibling.textContent = t.value + ' m'; renderPlan();
  clearTimeout(simT); simT = setTimeout(() => { const id = t.id; render(); const el = $(id); if (el) el.focus(); }, 300);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.lb').forEach(x => x.remove()); });
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(renderPlan, 120); });
async function onAddPlace(e) {
  e.preventDefault();
  const num = id => { const v = $(id).value; return v === '' ? null : Math.max(0, Math.min(L, +v)); };
  const m = num('pM'), m2 = num('pM2');
  if (m == null) { $('placeMsg').textContent = 'Give the position in metres from A.'; return; }
  const p = { name: $('pName').value.trim().slice(0, 80), kind: $('pKind').value, status: $('pStatus').value, m, m2: m2 != null && m2 > m ? m2 : null, date: $('pDate').value || null, r: +$('pR').value || 40, note: $('pNote').value.trim().slice(0, 240), at: Date.now() };
  const by = await whoId(); if (by) p.by = by;
  const msg = await addPlace(p); const el = $('placeMsg'); if (el) el.textContent = msg;
}
async function onAddReport(e) {
  e.preventDefault();
  const m = $('rM').value === '' ? null : Math.max(0, Math.min(L, +$('rM').value));
  if (m == null) { $('repMsg').textContent = 'Give the position in metres from A.'; return; }
  const r = { m, cause: $('rCause').value, room: state.reportRoom, date: $('rDate').value || null, note: $('rNote').value.trim().slice(0, 240), at: Date.now() };
  const by = await whoId(); if (by) r.by = by;
  const msg = await addReport(r); const el = $('repMsg'); if (el) el.textContent = msg;
}
async function saveNote() {
  const text = $('noteText').value.trim(); if (!text) { $('noteMsg').textContent = 'Write your assessment first.'; return; }
  const n = { scenario: state.scenario, text: text.slice(0, 2000), at: Date.now(), ctx: `${state.dir === 'both' ? 'both ways' : DIRL[state.dir]}, ${state.light}, ${state.daysA.size} days` };
  const by = await whoId(); if (by) n.by = by;
  if (DB) { try { await DB.collection('notes').add(n); $('noteMsg').textContent = 'Saved for everyone.'; $('noteText').value = ''; } catch (err) { $('noteMsg').textContent = 'Could not save: ' + (err.code === 'not_granted' ? 'this link lets you view only. Ask the owner for access.' : err.message || err.code); } return; }
  NOTES = [n, ...NOTES]; store.set('notes', NOTES); $('noteMsg').textContent = 'Saved in this browser.'; $('noteText').value = ''; renderNotes();
}

$('corrName').textContent = `${RAW.corridor.name.split(',')[0]} · ${RAW.corridor.city} · ${L} m`;
setMod(state.mod);
render();
})();
